<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'self'">
  <title>Agenta team collaboration walkthrough</title>
  <style>
    :root {
      --bg: #f2efe7;
      --surface: #fffdf8;
      --surface-2: #ebe7dc;
      --ink: #18211f;
      --muted: #65706c;
      --line: #d8d2c4;
      --data: #2563eb;
      --data-soft: #dbeafe;
      --ok: #16845b;
      --ok-soft: #dff6eb;
      --warn: #b56705;
      --warn-soft: #fff0cf;
      --error: #c23b3b;
      --error-soft: #fee7e4;
      --violet: #7451c8;
      --violet-soft: #ebe5fb;
      --shadow: 0 20px 55px rgba(42, 38, 29, .11);
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    html[data-theme="dark"] {
      --bg: #111714;
      --surface: #19211e;
      --surface-2: #222c28;
      --ink: #f2f4ef;
      --muted: #a3afa9;
      --line: #34403b;
      --data: #72a1ff;
      --data-soft: #1d3157;
      --ok: #65d2a3;
      --ok-soft: #183b2d;
      --warn: #f0b85a;
      --warn-soft: #45351d;
      --error: #ff8580;
      --error-soft: #4c2424;
      --violet: #b7a0ff;
      --violet-soft: #352b55;
      --shadow: 0 25px 70px rgba(0, 0, 0, .35);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 12% 12%, color-mix(in srgb, var(--data) 9%, transparent), transparent 30%),
        radial-gradient(circle at 88% 90%, color-mix(in srgb, var(--violet) 8%, transparent), transparent 28%),
        var(--bg);
      color: var(--ink);
      font-family: var(--sans);
    }

    button { font: inherit; }
    .shell { min-height: 100vh; display: flex; flex-direction: column; }

    .topbar {
      display: grid;
      grid-template-columns: minmax(240px, 1fr) auto;
      gap: 24px;
      align-items: center;
      padding: 18px 28px 14px;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand { display: flex; gap: 13px; align-items: center; min-width: 0; }
    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      color: white;
      background: linear-gradient(145deg, #1d4ed8, #6d4ac7);
      box-shadow: 0 9px 24px rgba(37, 99, 235, .24);
      font-weight: 800;
      letter-spacing: -.04em;
    }
    .brand-copy { min-width: 0; }
    .brand-copy strong { display: block; font-size: 15px; letter-spacing: -.01em; }
    .brand-copy span { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }

    .top-actions { display: flex; gap: 10px; align-items: center; }
    .chapter-count { color: var(--muted); font-size: 12px; font-family: var(--mono); }
    .icon-button {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      border-radius: 10px;
      padding: 9px 12px;
      cursor: pointer;
    }
    .icon-button:hover { border-color: var(--data); }

    .chapter-nav {
      display: grid;
      grid-template-columns: repeat(5, minmax(150px, 1fr));
      gap: 8px;
      padding: 12px 28px;
      overflow-x: auto;
      border-bottom: 1px solid var(--line);
    }

    .chapter-tab {
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      border-radius: 12px;
      text-align: left;
      padding: 10px 12px;
      cursor: pointer;
      min-width: 150px;
    }
    .chapter-tab:hover { background: var(--surface-2); color: var(--ink); }
    .chapter-tab.active {
      background: var(--surface);
      border-color: var(--line);
      color: var(--ink);
      box-shadow: 0 8px 22px rgba(35, 31, 24, .06);
    }
    .chapter-tab small {
      display: block;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .chapter-tab strong { font-size: 13px; }

    .workspace {
      width: min(1500px, 100%);
      margin: 0 auto;
      padding: 22px 28px 108px;
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(330px, .8fr);
      gap: 18px;
      flex: 1;
    }

    .panel {
      background: color-mix(in srgb, var(--surface) 96%, transparent);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
      min-width: 0;
      overflow: hidden;
    }

    .stage { min-height: 640px; display: flex; flex-direction: column; }
    .stage-head { padding: 24px 26px 12px; }
    .eyebrow {
      color: var(--data);
      text-transform: uppercase;
      letter-spacing: .12em;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 800;
    }
    h1 { margin: 8px 0 0; font-size: clamp(27px, 3vw, 43px); line-height: 1.04; letter-spacing: -.045em; }

    .diagram {
      margin: 10px 26px 0;
      min-height: 310px;
      border: 1px solid var(--line);
      border-radius: 17px;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px),
        color-mix(in srgb, var(--surface-2) 50%, var(--surface));
      background-size: 32px 32px;
    }

    .actors {
      position: absolute;
      inset: 34px 26px auto;
      display: grid;
      grid-template-columns: repeat(var(--actor-count), minmax(0, 1fr));
      gap: 14px;
      z-index: 3;
    }
    .actor {
      min-height: 104px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      padding: 14px 13px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: opacity .5s ease, transform .5s ease, border-color .5s ease, background .5s ease;
    }
    .actor.dim { opacity: .45; transform: scale(.97); }
    .actor.data { border-color: var(--data); background: var(--data-soft); }
    .actor.ok { border-color: var(--ok); background: var(--ok-soft); }
    .actor.warn { border-color: var(--warn); background: var(--warn-soft); }
    .actor.error { border-color: var(--error); background: var(--error-soft); }
    .actor.violet { border-color: var(--violet); background: var(--violet-soft); }
    .actor-name { font-weight: 760; font-size: 14px; letter-spacing: -.015em; }
    .actor-sub { color: var(--muted); font-size: 11px; line-height: 1.35; margin-top: 10px; }

    .track {
      position: absolute;
      left: 6%;
      right: 6%;
      bottom: 68px;
      height: 48px;
      border-top: 1px dashed color-mix(in srgb, var(--muted) 52%, transparent);
    }
    .track::before, .track::after {
      position: absolute;
      top: -19px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    .track::before { content: "start"; left: 0; }
    .track::after { content: "decision"; right: 0; }

    .packet {
      position: absolute;
      left: var(--packet-x);
      top: 11px;
      width: min(180px, 28%);
      min-width: 105px;
      transform: translateX(-50%);
      border: 1px solid var(--data);
      background: var(--data);
      color: white;
      border-radius: 999px;
      padding: 8px 12px;
      text-align: center;
      font-size: 11px;
      font-weight: 750;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: 0 7px 22px color-mix(in srgb, var(--data) 30%, transparent);
      transition: left .7s ease, background .5s ease, border-color .5s ease, width .5s ease;
    }
    .packet.ok { background: var(--ok); border-color: var(--ok); }
    .packet.warn { background: var(--warn); border-color: var(--warn); }
    .packet.error { background: var(--error); border-color: var(--error); animation: shake .55s ease; }
    .packet.violet { background: var(--violet); border-color: var(--violet); }

    .turning-point {
      position: absolute;
      right: 5.5%;
      bottom: 50px;
      width: 4px;
      height: 84px;
      border-radius: 5px;
      background: var(--warn);
      opacity: 0;
      transition: opacity .4s ease, background .4s ease;
    }
    .turning-point.show { opacity: 1; }
    .turning-point.error { background: var(--error); }
    .turning-point::before {
      content: attr(data-label);
      position: absolute;
      right: -3px;
      top: -25px;
      transform: translateX(0);
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 4px 7px;
      font-size: 9px;
      font-family: var(--mono);
      white-space: nowrap;
    }

    .callout {
      position: absolute;
      left: 26px;
      right: 26px;
      bottom: 12px;
      text-align: center;
      color: var(--muted);
      font-size: 11px;
    }

    .narration { padding: 21px 26px 24px; display: grid; gap: 12px; }
    .narration p { margin: 0; color: var(--muted); line-height: 1.62; font-size: 15px; max-width: 76ch; }
    .narration strong { color: var(--ink); }
    .verdict {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      border-radius: 999px;
      padding: 6px 10px;
      background: var(--surface-2);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 10px;
    }

    .evidence {
      background: #0d1311;
      color: #e9efe9;
      min-height: 640px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .24);
    }
    .evidence-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 20px;
      border-bottom: 1px solid #28332f;
    }
    .evidence-head strong { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
    .evidence-head span { color: #7f928a; font-family: var(--mono); font-size: 9px; }
    .debug-section { padding: 17px 20px; border-bottom: 1px solid #28332f; }
    .debug-label { color: #7f928a; font-family: var(--mono); font-size: 9px; letter-spacing: .11em; text-transform: uppercase; margin-bottom: 10px; }
    pre {
      margin: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.55;
      color: #d6e4dc;
    }
    .source { color: #7f928a; margin-top: 10px; font-family: var(--mono); font-size: 9px; line-height: 1.45; }
    .watch { display: grid; gap: 8px; }
    .watch-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: baseline; font-family: var(--mono); font-size: 10px; }
    .watch-row span:first-child { color: #92a39b; }
    .watch-row span:last-child { color: #e8efe9; text-align: right; }
    .watch-row.ok span:last-child { color: #78dfae; }
    .watch-row.warn span:last-child { color: #f2c166; }
    .watch-row.error span:last-child { color: #ff8e88; }
    .watch-row.data span:last-child { color: #8db4ff; }
    .console { color: #9aac9f; }
    .console .ok { color: #78dfae; }
    .console .warn { color: #f2c166; }
    .console .error { color: #ff8e88; }

    .controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 18px;
      align-items: center;
      padding: 14px 28px;
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      backdrop-filter: blur(18px);
      border-top: 1px solid var(--line);
    }
    .nav-button {
      min-width: 105px;
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 10px 15px;
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      font-weight: 700;
    }
    .nav-button.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
    .nav-button:disabled { opacity: .35; cursor: not-allowed; }

    .step-meta { min-width: 0; text-align: center; }
    .step-title { font-size: 11px; font-family: var(--mono); color: var(--muted); margin-bottom: 8px; }
    .dots { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
    .dot {
      width: 8px;
      height: 8px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: var(--line);
      cursor: pointer;
    }
    .dot.active { background: var(--data); transform: scale(1.35); }
    .dot.past { background: color-mix(in srgb, var(--data) 45%, var(--line)); }

    @keyframes shake {
      0%, 100% { transform: translateX(-50%); }
      25% { transform: translateX(calc(-50% - 7px)); }
      75% { transform: translateX(calc(-50% + 7px)); }
    }

    @media (max-width: 1020px) {
      .workspace { grid-template-columns: 1fr; }
      .stage, .evidence { min-height: auto; }
      .evidence { border-radius: 18px; }
    }

    @media (max-width: 680px) {
      .topbar { padding: 14px 16px; gap: 10px; }
      .brand-copy span, .chapter-count { display: none; }
      .chapter-nav { padding: 10px 16px; grid-template-columns: repeat(5, 158px); }
      .workspace { padding: 15px 12px 126px; }
      .stage-head { padding: 19px 18px 10px; }
      .diagram { margin: 8px 12px 0; min-height: 400px; }
      .actors { inset: 20px 16px auto; grid-template-columns: 1fr 1fr; gap: 8px; }
      .actor { min-height: 84px; padding: 10px; }
      .track { bottom: 62px; }
      .narration { padding: 18px; }
      .controls { padding: 11px 12px; gap: 10px; grid-template-columns: auto 1fr auto; }
      .nav-button { min-width: 74px; padding: 9px 10px; font-size: 12px; }
      .step-title { font-size: 9px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">A</div>
        <div class="brand-copy">
          <strong>Team collaboration, explained</strong>
          <span>Market research -> product direction -> safe architecture</span>
        </div>
      </div>
      <div class="top-actions">
        <span class="chapter-count" id="chapterCount"></span>
        <button class="icon-button" id="themeToggle" type="button" aria-label="Toggle color theme">Dark</button>
      </div>
    </header>

    <nav class="chapter-nav" id="chapterNav" aria-label="Walkthrough chapters"></nav>

    <main class="workspace">
      <section class="panel stage" aria-live="polite">
        <div class="stage-head">
          <div class="eyebrow" id="eyebrow"></div>
          <h1 id="stepHeading"></h1>
        </div>
        <div class="diagram" id="diagram">
          <div class="actors" id="actors"></div>
          <div class="track">
            <div class="packet" id="packet"></div>
          </div>
          <div class="turning-point" id="turningPoint"></div>
          <div class="callout" id="callout"></div>
        </div>
        <div class="narration">
          <p id="narration"></p>
          <span class="verdict" id="verdict"></span>
        </div>
      </section>

      <aside class="panel evidence" aria-label="Evidence panel">
        <div class="evidence-head">
          <strong>Evidence</strong>
          <span id="evidenceMode">contract debugger</span>
        </div>
        <section class="debug-section">
          <div class="debug-label">Contract</div>
          <pre id="contract"></pre>
          <div class="source" id="source"></div>
        </section>
        <section class="debug-section">
          <div class="debug-label">Watch</div>
          <div class="watch" id="watch"></div>
        </section>
        <section class="debug-section" style="border-bottom:0; flex:1">
          <div class="debug-label">Decision log</div>
          <pre class="console" id="console"></pre>
        </section>
      </aside>
    </main>

    <footer class="controls">
      <button class="nav-button" id="backButton" type="button">Back</button>
      <div class="step-meta">
        <div class="step-title" id="stepMeta"></div>
        <div class="dots" id="dots"></div>
      </div>
      <button class="nav-button primary" id="nextButton" type="button">Next</button>
    </footer>
  </div>

  <script>
    const a = (name, sub, state = "neutral") => ({ name, sub, state });
    const w = (name, value, state = "neutral") => ({ name, value, state });
    const step = (title, narration, actors, packet, evidence, options = {}) => ({
      title, narration, actors, packet, evidence,
      eyebrow: options.eyebrow || "",
      verdict: options.verdict || "",
      callout: options.callout || "",
      gate: options.gate || null
    });

    const chapters = [
      {
        id: "research",
        short: "Market model",
        label: "01 Research",
        description: "How three competitors move work from personal to shared.",
        steps: [
          step("One conversation needs an audience", "Across the market, the conversation starts with a clear context. Personal work stays personal. Team work enters a shared space.", [
            a("Person", "starts a conversation", "data"), a("Personal context", "one person's work", "neutral"), a("Share choice", "explicit transition", "warn"), a("Team context", "known members", "ok")
          ], { label: "conversation", x: 13, state: "data" }, {
            contract: "personal work -> explicit share -> team context",
            source: "research.md:9-17",
            watch: [w("personal option", "market baseline", "ok"), w("share action", "explicit", "data"), w("team audience", "visible", "ok")],
            console: ". market pattern found\n. audience changes by context"
          }, { eyebrow: "Market research", verdict: "Common pattern: personal first, shared by choice", callout: "Follow the blue conversation." }),

          step("Competitor A makes sharing participatory", "Competitor A starts an ordinary Conversation private. A named colleague joins the same history and can reply. Access still respects the Agent and its data Spaces.", [
            a("Creator", "private Conversation", "data"), a("Share link", "eligible colleague", "warn"), a("Participant", "sees history and replies", "ok"), a("Data Space", "still authorizes access", "violet")
          ], { label: "live Conversation", x: 66, state: "ok" }, {
            contract: "private -> share -> participant\nparticipant can read + reply",
            source: "research.md:81-98",
            watch: [w("default", "private", "ok"), w("recipient", "Workspace colleague", "data"), w("reply", "allowed", "ok")],
            console: "+ participant joins\n+ full history visible\n+ reply enabled"
          }, { eyebrow: "Competitor A", verdict: "Conversation sharing is a live collaboration", callout: "The link does not bypass Space access." }),

          step("Competitor A Pods reverse the default", "Inside a Pod, every member can see and contribute to every Pod Conversation. The same product supports personal conversations and an explicit shared room.", [
            a("Conversation", "outside Pod: private", "data"), a("Pod boundary", "open or restricted", "warn"), a("Pod members", "all can contribute", "ok"), a("Agent memory", "Pod content indexed", "violet")
          ], { label: "Pod Conversation", x: 78, state: "ok" }, {
            contract: "if conversation.in_pod:\n  audience = pod.members\n  contribution = allowed",
            source: "research.md:90-99",
            watch: [w("Pod audience", "all members", "ok"), w("contribute", "yes", "ok"), w("Agent context", "indexed", "data")],
            console: "+ shared context selected\n+ team memory available"
          }, { eyebrow: "Competitor A", verdict: "Shared context is explicit", callout: "Private and shared work coexist." }),

          step("Competitor B separates links from Projects", "An ordinary chat gets a revocable Workspace link. A shared Project is broader: its members see current and future chats, files, and instructions.", [
            a("Ordinary chat", "creator context", "data"), a("Workspace link", "read access", "warn"), a("Project", "shared context", "violet"), a("Project members", "all Project content", "ok")
          ], { label: "chat or Project", x: 61, state: "violet" }, {
            contract: "chat link: one conversation\nProject: current + future context",
            source: "research.md:156-182",
            watch: [w("unshared default", "implicit", "warn"), w("link", "revocable", "ok"), w("Project inheritance", "automatic", "data")],
            console: ". ordinary chat sharing is narrow\n. Project sharing is durable"
          }, { eyebrow: "Competitor B", verdict: "One-off sharing and team context are separate" }),

          step("Competitor C has a visible personal/team split", "Every user has a private Personal Space. Moving an Agent or Workflow into a Team gives Team members access under the Team's rules.", [
            a("Personal Space", "private by default", "data"), a("Move to Team", "explicit action", "warn"), a("Team", "shared resource space", "ok"), a("Organization", "admin boundary", "violet")
          ], { label: "Agent / Workflow", x: 68, state: "ok" }, {
            contract: "Organization\n  Personal Spaces\n  Teams",
            source: "research.md:221-249",
            watch: [w("personal resource", "restricted", "ok"), w("Team resource", "Team-visible", "data"), w("nested Teams", "not documented", "warn")],
            console: "+ explicit personal area\n+ explicit shared area"
          }, { eyebrow: "Competitor C", verdict: "The place of the resource defines its baseline audience" }),

          step("Resource access is not one bit", "Competitors distinguish using an Agent from seeing or changing its internals. Competitor C names Owner, Editor, Viewer, and Use Only. Competitor B separates use and edit grants.", [
            a("Use", "invoke only", "data"), a("View", "inspect internals", "violet"), a("Edit", "change configuration", "warn"), a("Manage", "sharing and ownership", "ok")
          ], { label: "resource grant", x: 74, state: "violet" }, {
            contract: "use != view != edit != manage",
            source: "research.md:250-269, 190-207",
            watch: [w("least privilege", "supported", "ok"), w("config exposure", "separate", "data"), w("ownership", "resource-level", "violet")],
            console: "+ invocation can hide internals\n+ editing stays explicit"
          }, { eyebrow: "Access model", verdict: "Audience and capability are different questions" }),

          step("Agenta has one visibility mode today", "Workspace members are mirrored into Projects. A member with view_sessions can read every Project session. There is no personal area or session share operation.", [
            a("Workspace member", "mirrored to Projects", "data"), a("Project role", "view_sessions", "warn"), a("All sessions", "Project-visible", "error"), a("Share control", "absent", "dim")
          ], { label: "interactive session", x: 88, state: "error" }, {
            contract: "membership -> Project role -> every session",
            source: "research.md:18-34, 359-381",

          }, { eyebrow: "Lifecycle", verdict: "Identity removal is also resource-authority removal" }),

          step("Revoke stops the future, not the past", "New reads, streams, downloads, exports, and signed URLs fail. Content already downloaded cannot be recalled. Audit records contain policy metadata, not session content.", [
            a("Revoke", "revision increments", "data"), a("Future access", "denied", "ok"), a("Existing copy", "cannot recall", "warn"), a("Audit outbox", "non-content event", "violet")
          ], { label: "future access denied", x: 91, state: "ok" }, {
            contract: "revoke -> deny new access\naudit -> actor + IDs + old/new policy",
            source: "rfc-2-session-sharing.md:105-137",
            watch: [w("new reads", "blocked", "ok"), w("downloaded copies", "remain", "warn"), w("audit transcript", "never", "ok")],
            console: "+ honest revocation contract\n+ durable non-content audit"
          }, { eyebrow: "RFC 2 summary", verdict: "Named View, atomic revoke, no execution ambiguity" })
        ]
      }
    ];

    let chapterIndex = 0;
    let stepIndex = 0;

    const els = {
      chapterNav: document.getElementById("chapterNav"),
      chapterCount: document.getElementById("chapterCount"),
      eyebrow: document.getElementById("eyebrow"),
      heading: document.getElementById("stepHeading"),
      actors: document.getElementById("actors"),
      packet: document.getElementById("packet"),
      turningPoint: document.getElementById("turningPoint"),
      callout: document.getElementById("callout"),
      narration: document.getElementById("narration"),
      verdict: document.getElementById("verdict"),
      contract: document.getElementById("contract"),
      source: document.getElementById("source"),
      watch: document.getElementById("watch"),
      console: document.getElementById("console"),
      stepMeta: document.getElementById("stepMeta"),
      dots: document.getElementById("dots"),
      back: document.getElementById("backButton"),
      next: document.getElementById("nextButton"),
      theme: document.getElementById("themeToggle")
    };

    function renderChapterNav() {
      els.chapterNav.innerHTML = "";
      chapters.forEach((chapter, index) => {
        const button = document.createElement("button");
        button.className = `chapter-tab${index === chapterIndex ? " active" : ""}`;
        button.type = "button";
        button.innerHTML = `<small>${chapter.label}</small><strong>${chapter.short}</strong>`;
        button.title = chapter.description;
        button.addEventListener("click", () => {
          chapterIndex = index;
          stepIndex = 0;
          render();
        });
        els.chapterNav.appendChild(button);
      });
    }

    function renderActors(items) {
      els.actors.innerHTML = "";
      els.actors.style.setProperty("--actor-count", Math.min(items.length, 4));
      items.forEach(item => {
        const node = document.createElement("div");
        node.className = `actor ${item.state}`;
        node.innerHTML = `<div class="actor-name">${item.name}</div><div class="actor-sub">${item.sub}</div>`;
        els.actors.appendChild(node);
      });
    }

    function renderWatch(rows) {
      els.watch.innerHTML = "";
      rows.forEach(row => {
        const node = document.createElement("div");
        node.className = `watch-row ${row.state}`;
        node.innerHTML = `<span>${row.name}</span><span>${row.value}</span>`;
        els.watch.appendChild(node);
      });
    }

    function renderDots(chapter) {
      els.dots.innerHTML = "";
      chapter.steps.forEach((_, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `dot${index === stepIndex ? " active" : index < stepIndex ? " past" : ""}`;
        button.setAttribute("aria-label", `Go to step ${index + 1}`);
        button.addEventListener("click", () => {
          stepIndex = index;
          render();
        });
        els.dots.appendChild(button);
      });
    }

    function render() {
      const chapter = chapters[chapterIndex];
      const current = chapter.steps[stepIndex];
      renderChapterNav();
      renderActors(current.actors);
      renderWatch(current.evidence.watch);
      renderDots(chapter);

      els.chapterCount.textContent = `${chapterIndex + 1} / ${chapters.length} chapters`;
      els.eyebrow.textContent = current.eyebrow || chapter.label;
      els.heading.textContent = current.title;
      els.narration.innerHTML = current.narration;
      els.verdict.textContent = current.verdict || chapter.description;
      els.callout.textContent = current.callout || "";
      els.contract.textContent = current.evidence.contract;
      els.source.textContent = current.evidence.source;
      els.console.textContent = current.evidence.console;

      els.packet.textContent = current.packet.label;
      els.packet.className = `packet ${current.packet.state || "data"}`;
      els.packet.parentElement.style.setProperty("--packet-x", `${current.packet.x}%`);

      if (current.gate) {
        els.turningPoint.className = `turning-point show ${current.gate.state || ""}`;
        els.turningPoint.dataset.label = current.gate.label;
      } else {
        els.turningPoint.className = "turning-point";
        els.turningPoint.dataset.label = "";
      }

      const atStart = chapterIndex === 0 && stepIndex === 0;
      const atEnd = chapterIndex === chapters.length - 1 && stepIndex === chapter.steps.length - 1;
      els.back.disabled = atStart;
      els.next.textContent = atEnd ? "Restart" : stepIndex === chapter.steps.length - 1 ? "Next chapter" : "Next";
      els.stepMeta.textContent = `${chapter.label} | Step ${stepIndex + 1} of ${chapter.steps.length}`;

      history.replaceState(null, "", `#${chapter.id}/${stepIndex + 1}`);
      document.title = `${current.title} | Agenta collaboration`;
    }

    function goNext() {
      const chapter = chapters[chapterIndex];
      if (stepIndex < chapter.steps.length - 1) {
        stepIndex += 1;
      } else if (chapterIndex < chapters.length - 1) {
        chapterIndex += 1;
        stepIndex = 0;
      } else {
        chapterIndex = 0;
        stepIndex = 0;
      }
      render();
    }

    function goBack() {
      if (stepIndex > 0) {
        stepIndex -= 1;
      } else if (chapterIndex > 0) {
        chapterIndex -= 1;
        stepIndex = chapters[chapterIndex].steps.length - 1;
      }
      render();
    }

    function setTheme(theme) {
      document.documentElement.dataset.theme = theme;
      els.theme.textContent = theme === "dark" ? "Light" : "Dark";
      try { localStorage.setItem("collaboration-walkthrough-theme", theme); } catch (_) {}
    }

    els.next.addEventListener("click", goNext);
    els.back.addEventListener("click", goBack);
    els.theme.addEventListener("click", () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));
    document.addEventListener("keydown", event => {
      if (event.key === "ArrowRight") goNext();
      if (event.key === "ArrowLeft") goBack();
    });

    const hashMatch = location.hash.match(/^#([^/]+)\/(\d+)$/);
    if (hashMatch) {
      const found = chapters.findIndex(chapter => chapter.id === hashMatch[1]);
      if (found >= 0) {
        chapterIndex = found;
        stepIndex = Math.max(0, Math.min(chapters[found].steps.length - 1, Number(hashMatch[2]) - 1));
      }
    }

    let initialTheme = "light";
    try {
      initialTheme = localStorage.getItem("collaboration-walkthrough-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    } catch (_) {}
    setTheme(initialTheme);
    render();
  </script>
</body>
</html>
