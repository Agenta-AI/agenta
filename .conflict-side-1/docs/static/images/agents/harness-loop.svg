<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360" role="img" aria-label="The harness runs the model in a loop: it sends the conversation, instructions and tool list to the model; the model replies with an answer or a tool call; the harness runs the tool and feeds the result back.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3f4550"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #c9ced8; stroke-width: 1.5; }
      .accent { fill: #fbf5e3; stroke: #d8c98f; stroke-width: 1.5; }
      .title { font: 600 16px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1c1f26; }
      .label { font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #4a515e; }
      .edge { stroke: #3f4550; stroke-width: 1.6; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="860" height="360" rx="10" fill="#fcfcfd"/>

  <!-- You -->
  <rect class="box" x="24" y="150" width="104" height="60" rx="8"/>
  <text class="title" x="76" y="186" text-anchor="middle">You</text>

  <!-- Harness -->
  <rect class="accent" x="228" y="140" width="200" height="80" rx="8"/>
  <text class="title" x="328" y="176" text-anchor="middle">Harness</text>
  <text class="label" x="328" y="198" text-anchor="middle">Claude Code, Pi, or Codex</text>

  <!-- Model -->
  <rect class="box" x="628" y="140" width="200" height="80" rx="8"/>
  <text class="title" x="728" y="176" text-anchor="middle">Model</text>
  <text class="label" x="728" y="198" text-anchor="middle">messages in, message out</text>

  <!-- Tool -->
  <rect class="box" x="228" y="284" width="200" height="56" rx="8"/>
  <text class="title" x="328" y="318" text-anchor="middle">Tool</text>

  <!-- You -> Harness -->
  <path class="edge" d="M 128 180 L 220 180" marker-end="url(#arrow)"/>
  <text class="label" x="174" y="168" text-anchor="middle">task</text>

  <!-- Harness -> Model -->
  <path class="edge" d="M 428 162 L 620 162" marker-end="url(#arrow)"/>
  <text class="label" x="524" y="150" text-anchor="middle">conversation, instructions, tool list</text>

  <!-- Model -> Harness -->
  <path class="edge" d="M 620 200 L 436 200" marker-end="url(#arrow)"/>
  <text class="label" x="524" y="220" text-anchor="middle">an answer, or a tool call</text>

  <!-- Harness -> Tool -->
  <path class="edge" d="M 296 220 L 296 276" marker-end="url(#arrow)"/>
  <text class="label" x="286" y="252" text-anchor="end">runs it</text>

  <!-- Tool -> Harness -->
  <path class="edge" d="M 360 284 L 360 228" marker-end="url(#arrow)"/>
  <text class="label" x="372" y="252" text-anchor="start">result</text>

  <!-- Harness -> You (exit) -->
  <path class="edge" d="M 260 140 C 260 90, 76 96, 76 144" marker-end="url(#arrow)"/>
  <text class="label" x="166" y="90" text-anchor="middle">the answer, once no tool call is left</text>
</svg>
