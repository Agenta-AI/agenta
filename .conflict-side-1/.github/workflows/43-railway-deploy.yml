name: "43 - railway deploy"

on:
  workflow_call:
    inputs:
      image_tag:
        description: "Image tag deployed by setup (e.g. pr-123-abc1234)"
        required: true
        type: string
      pr_number:
        description: "PR number"
        required: true
        type: string
    secrets:
      RAILWAY_TOKEN:
        required: true
    outputs:
      preview_url:
        description: "The URL of the deployed preview environment"
        value: ${{ jobs.deploy.outputs.preview_url }}
      project_name:
        description: "Railway project name"
        value: ${{ jobs.deploy.outputs.project_name }}
      environment_name:
        description: "Railway environment name"
        value: ${{ jobs.deploy.outputs.environment_name }}
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag deployed by setup"
        required: true
        type: string
      pr_number:
        description: "PR number"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: railway-preview-deploy-${{ inputs.pr_number }}
  cancel-in-progress: true

env:
  RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  # Template location (issue #5650). The repo variables let a future template
  # project move happen without a code change; the scripts carry the same
  # defaults, so local runs and CI agree.
  RAILWAY_TEMPLATE_PROJECT: ${{ vars.RAILWAY_TEMPLATE_PROJECT || 'agenta-oss-clone-spike' }}
  RAILWAY_TEMPLATE_ENV: ${{ vars.RAILWAY_TEMPLATE_ENV || 'pr-template' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      preview_url: ${{ steps.verify.outputs.preview_url }}
      project_name: ${{ steps.verify.outputs.project_name }}
      environment_name: ${{ steps.verify.outputs.environment_name }}
      railway_logs_url: ${{ steps.verify.outputs.railway_logs_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Install jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y jq
          fi

      # Setup (41) already created the environment, patched the images and
      # smoked it. This step re-verifies the smoke endpoints (mutation-free)
      # and emits the outputs the tests job and the PR comment consume.
      - name: Verify preview environment
        id: verify
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          chmod +x hosting/railway/oss/scripts/*.sh

          # Persist the full log so the "Upload deploy log" step can publish it
          # as an artifact, regardless of live-log truncation.
          log_file="${GITHUB_WORKSPACE:-$PWD}/railway-deploy-${PR_NUMBER:-unknown}.log"

          set +e
          hosting/railway/oss/scripts/preview-clone-create.sh --verify-only 2>&1 | tee "$log_file"
          verify_status=${PIPESTATUS[0]}
          set -e

          status_label="Deployed"
          [ "$verify_status" -ne 0 ] && status_label="Failed"
          {
            echo "### Railway Preview Deploy"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| PR | \`${PR_NUMBER}\` |"
            echo "| Image tag | \`${IMAGE_TAG}\` |"
            echo "| Status | ${status_label} |"
            if [ "$verify_status" -ne 0 ]; then
              echo
              echo "<details><summary>Verify log (last 100 lines)</summary>"
              echo
              echo '```'
              tail -n 100 "$log_file" 2>/dev/null
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$verify_status"

      - name: Upload deploy log
        if: always()
        # Diagnostics only: a failed/duplicate upload must never fail the job.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: railway-deploy-log-${{ inputs.pr_number }}
          path: railway-deploy-*.log
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

      - name: Post preview URL as PR comment
        if: inputs.pr_number != '' && steps.verify.outputs.preview_url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt('${{ inputs.pr_number }}');
            const previewUrl = '${{ steps.verify.outputs.preview_url }}';
            const projectName = '${{ steps.verify.outputs.project_name }}';
            const imageTag = '${{ inputs.image_tag }}';
            const marker = '<!-- railway-preview-bot -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const railwayLogsUrl = '${{ steps.verify.outputs.railway_logs_url }}';

            const body = [
              marker,
              '### Railway Preview Environment',
              '',
              `| | |`,
              `|---|---|`,
              `| **Preview URL** | ${previewUrl} |`,
              `| **Project** | \`${projectName}\` |`,
              `| **Image tag** | \`${imageTag}\` |`,
              `| **Status** | Deployed |`,
              railwayLogsUrl ? `| **Railway logs** | [Open logs](${railwayLogsUrl}) |` : null,
              `| **Workflow logs** | [View workflow run](${runUrl}) |`,
              '',
              `_Updated at ${new Date().toISOString()}_`,
            ].filter(Boolean).join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

      - name: Post failure comment
        if: failure() && inputs.pr_number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt('${{ inputs.pr_number }}');
            const imageTag = '${{ inputs.image_tag }}';
            const marker = '<!-- railway-preview-bot -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const previewUrl = '${{ steps.verify.outputs.preview_url }}';
            const railwayLogsUrl = '${{ steps.verify.outputs.railway_logs_url }}';

            const body = [
              marker,
              '### Railway Preview Environment',
              '',
              `| | |`,
              `|---|---|`,
              previewUrl ? `| **Preview URL** | ${previewUrl} |` : null,
              `| **Image tag** | \`${imageTag}\` |`,
              `| **Status** | Failed |`,
              railwayLogsUrl ? `| **Railway logs** | [Open logs](${railwayLogsUrl}) |` : null,
              `| **Logs** | [View workflow run](${runUrl}) |`,
              '',
              `_Updated at ${new Date().toISOString()}_`,
            ].filter(Boolean).join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
