<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="100%" height="100%" fill="#0f172a" rx="12"/>
  <text x="40" y="50" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="700">Agenta CI: Office Viewer Bundle Validation Architecture</text>
  <text x="40" y="80" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14">Resolves #7771: Independent CI check preventing stale office viewer bundles in releases</text>

  <!-- Left: Previous Monolithic Flow -->
  <g transform="translate(40, 110)">
    <rect width="340" height="240" fill="#1e293b" rx="8" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4"/>
    <text x="20" y="35" fill="#fca5a5" font-family="sans-serif" font-size="15" font-weight="600">❌ Previous Flow (Fragile)</text>
    <rect x="20" y="55" width="300" height="45" rx="6" fill="#334155"/>
    <text x="35" y="82" fill="#cbd5e1" font-family="sans-serif" font-size="13">1. Web unit tests (Package A)</text>
    <rect x="20" y="115" width="300" height="45" rx="6" fill="#7f1d1d"/>
    <text x="35" y="142" fill="#fecaca" font-family="sans-serif" font-size="13">2. Earlier package fails ➔ Aborts job!</text>
    <rect x="20" y="175" width="300" height="45" rx="6" fill="#1e293b" stroke="#475569"/>
    <text x="35" y="202" fill="#64748b" font-family="sans-serif" font-size="13">3. officeViewerBundle.test.ts (SKIPPED)</text>
  </g>

  <!-- Right: New Independent CI Job Flow -->
  <g transform="translate(420, 110)">
    <rect width="340" height="240" fill="#1e293b" rx="8" stroke="#10b981" stroke-width="2"/>
    <text x="20" y="35" fill="#6ee7b7" font-family="sans-serif" font-size="15" font-weight="600">✅ New Architecture (Guaranteed)</text>
    <rect x="20" y="55" width="300" height="45" rx="6" fill="#064e3b" stroke="#059669"/>
    <text x="35" y="82" fill="#a7f3d0" font-family="sans-serif" font-size="13">1. check-office-viewer-bundles (Independent)</text>
    <rect x="20" y="115" width="300" height="45" rx="6" fill="#064e3b" stroke="#059669"/>
    <text x="35" y="142" fill="#a7f3d0" font-family="sans-serif" font-size="13">2. node build-office-viewers.mjs --check</text>
    <rect x="20" y="175" width="300" height="45" rx="6" fill="#064e3b" stroke="#059669"/>
    <text x="35" y="202" fill="#a7f3d0" font-family="sans-serif" font-size="13">3. Pre-commit hook prevents local drift</text>
  </g>
</svg>
