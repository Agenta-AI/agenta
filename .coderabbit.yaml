# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# TEMPORARY — the `reviews.path_filters` block at the bottom of this file exists only to
# get PR #6049 reviewed, and MUST BE REMOVED BEFORE THAT PR MERGES. Leaving it in place
# would narrow reviews for every future pull request in this repository, which is the
# opposite of what it is for. Before merging, delete the block and confirm
# `git diff main -- .coderabbit.yaml` is empty.

# CodeRabbit only auto-reviews PRs whose base is the default branch, so every PR into a
# release/* branch was skipped ("Auto reviews are disabled on base/target branches other
# than the default branch") — which is most of the review traffic during a release.
#
# `inheritance: true` is load-bearing, not decoration. Configuration sources do NOT merge
# by default: a repo config file replaces the whole Organization UI configuration, and any
# field it omits falls through to CodeRabbit's schema defaults rather than to our org
# settings. Without it this two-line file would silently reset ~20 org choices (the chill
# profile, collapsed walkthroughs, the disabled poem, slop detection, finishing touches).
# With it, this file adds the base branches and changes nothing else.
inheritance: true

reviews:
  auto_review:
    # The default branch is always reviewed; these are additional. Regex, so this covers
    # release/v0.112.0 and every release branch after it.
    base_branches:
      - "release/.*"

  # TEMPORARY, PR #6049 ONLY. DELETE BEFORE MERGE. See the note at the top of this file.
  #
  # CodeRabbit caps a review at 300 files and refuses larger ones outright, reporting the
  # refusal as a PASSING check: "Review skipped: 518 files exceed the limit of 300". The cap
  # is a platform limit, not a setting, and no plan or `@coderabbitai full review` gets past
  # it — the count is checked before the review runs.
  #
  # Path-filtered files do not count toward it. CodeRabbit's own skip comment listed 7 files
  # ignored by the organization's filters and then "Files selected for processing (518)"
  # against 525 changed, so the filtered ones were already subtracted. Filters drive a
  # sparse checkout, so an excluded file is never even cloned.
  #
  # CodeRabbit reads this file from the branch under review, so the block below scopes to
  # this PR alone and leaves every other pull request untouched.
  #
  # `inheritance: true` does NOT merge this array with the organization's. Asking
  # `@coderabbitai configuration` on #6049 returned a path_filters list sourced entirely
  # from "Repository YAML (base)" and containing only the entries below: for this field a
  # repository list REPLACES the organization's rather than appending to it. The
  # organization's own exclusions are therefore repeated here explicitly, or its lock files
  # and generated code would be reviewed as if they were hand-written.
  #
  # This is PASS 3: the web design work, which is the only thing that changed since passes 1
  # and 2 read the rest. Passes 1 and 2 covered production source and then tests across the
  # whole pull request. The MCP redesign then added 60 files to the pass-1 set and took it to
  # 342, over the cap, so the remaining passes are split by area instead of by kind.
  #
  #   pass 3 (this file):  web/**, minus Storybook           140 files
  #   pass 4 (swap in):    api/**, sdks/**, services/**      182 files
  #
  # Pass 4's list is kept ready at ~/agenta-mcp-release/reviews/coderabbit-pass4.yaml; the
  # swap is a copy of that file's path_filters block over this one.
  #
  # Storybook is out because the human reviewers read the stories, and because a story is
  # exercised by the Storybook build that CI now runs. Tests are out because pass 2 took
  # them. Neither pass covers the design-doc markdown under docs/design/**, which is this
  # team's working notes rather than shipped code and is reviewed by the people writing it.
  #
  # Re-measure after any rebase or merge; the counts move with the base:
  #   pass 3:
  #     git diff --name-only e5643f00f5..HEAD | grep -E '^web/' \
  #       | grep -vE '^web/storybook/|\.lock$|\.generated\.|/generated/|(^|/)tests?/|\.(test|spec)\.tsx?$' | wc -l
  #   pass 4:
  #     git diff --name-only e5643f00f5..HEAD | grep -E '^(api|sdks|services)/' \
  #       | grep -vE '\.lock$|\.generated\.|/generated/|^docs/designs?/|(^|/)tests?/|(^|/)test_[^/]*\.py$|(^|/)pytest\.ini$|(^|/)run-tests\.py$' | wc -l
  path_filters:
    # Repeated from the Organization UI configuration, which this list replaces rather than
    # extends. Keep them in step with the organization's settings.
    - "!**/*.lock"
    - "!**/*.generated.*"
    - "!**/generated/**"
    # Everything outside web/. Pass 4 takes api, sdks and services; the rest is either
    # infrastructure, this team's own notes, or generated client code.
    - "!antd-inventory/**"
    - "!api/**"
    - "!benchmarks/**"
    - "!clients/**"
    - "!docs/**"
    - "!ee/**"
    - "!examples/**"
    - "!hooks/**"
    - "!hosting/**"
    - "!sdks/**"
    - "!services/**"
    - "!website/**"
    - "!.github/**"
    - "!.coderabbit.yaml"
    - "!.gitleaksignore"
    - "!.gitignore"
    # Read by people, not by CodeRabbit: the reviewers read the stories, and the Storybook
    # build in CI is what catches a story whose component changed shape.
    - "!web/storybook/**"
    # Tests, which pass 2 already took.
    - "!**/tests/**"
    - "!**/test/**"
    - "!**/test_*.py"
    - "!**/*.test.ts"
    - "!**/*.test.tsx"
    - "!**/*.spec.ts"
    - "!**/*.spec.tsx"
    - "!**/pytest.ini"
    - "!**/run-tests.py"
