# ================================================================== #
# Agenta — minimal values.yaml
#
# This file mirrors the docker-compose env surface defined in
#   hosting/docker-compose/oss/env.oss.gh.example
#   hosting/docker-compose/ee/env.ee.gh.example
#
# Variables that are uncommented in the compose example are uncommented
# here with the same default value.  Variables that are commented-out
# in compose are omitted entirely — templates supply sensible defaults
# via helm's `default` function and helpers in _helpers.tpl.
#
# All Kubernetes plumbing (image repositories, tags, ports, replicas,
# resources, security contexts, ingress wiring, postgresql/redis bundled
# deployment knobs) lives in the templates, not here.  Override only
# what you need.
# ================================================================== #

# ================================================================== #
# heartbeat — liveness for cron and the two workers.
#
# Each of those three runs its process as PID 1, so the container lifecycle
# already restarts a process that exits. What nothing caught was a process that
# is alive and no longer making progress. The probes that used to be here ran
# `pgrep` against that same PID 1, and `pgrep` is not in the image (agenta#7334).
#
# Now the application records the time on every turn, and the probe fails when
# the file goes stale. One value sets the path the application writes and the
# path the probe reads, so the two cannot disagree.
#
# What each workload proves is NOT the same, and it is worth knowing which:
#   * workerStreams writes once per loop turn, so a wedged loop is caught.
#   * workerQueues hands its loop to taskiq, so a sibling task writes on an
#     interval. That catches a blocked event loop. It does not catch a receiver
#     that polls and consumes nothing.
#   * cron writes from a crontab entry, so it proves schedules still fire, which
#     is the cron failure that matters.
#
# heartbeat:
#   enabled: true          # false removes the variable and all three probes
#   path: /tmp/agenta-heartbeat
#   staleSeconds: 120      # also the probe's initial delay, so a slow start is
#                          # not mistaken for a wedged loop
#
# Setting `<workload>.livenessProbe` still replaces the generated probe for that
# workload.
# ================================================================== #

# ================================================================== #
# Agenta — License (https://agenta.ai/pricing)
# ================================================================== #
agenta:
  license: oss

  # ================================================================ #
  # Agenta — Core endpoints
  # ================================================================ #
  # webUrl/apiUrl/servicesUrl are intentionally unset here. The chart derives
  # them from ingress.host when ingress.enabled=true, and the example values
  # in hosting/kubernetes/{oss,ee}/values.*.example.yaml set them explicitly
  # for the port-forward (no-ingress) path. A validation in _validations.tpl
  # fails the install if any of the three resolves to empty — that catches
  # the common "ingress disabled, URLs not set" misconfiguration as well as
  # partial overrides (e.g. setting only webUrl with ingress disabled).

  # ================================================================ #
  # Agenta — Secrets (REPLACE in production!)
  # ================================================================ #
  authKey: "replace-me"
  cryptKey: "replace-me"
  servicesInternalKey: "replace-me"
  runnerToken: "replace-me"

# ================================================================== #
# Agenta — Gateways
#
# Values mirror hosting/docker-compose/{oss,ee}/env.*.gh.example, which
# is the reference for a self-hosted install. Every key below is real:
# the chart renders it into the containers that read it, and only those.
#
#   llmGateway.enabled            -> AGENTA_LLM_GATEWAY_ENABLED
#   mcpGateway.enabled            -> AGENTA_MCP_GATEWAY_ENABLED
#   mcpGateway.hostAllowlist      -> AGENTA_MCP_GATEWAY_HOST_ALLOWLIST
#   gatewayEgress.insecureAllowed -> AGENTA_GATEWAYS_INSECURE_EGRESS_ALLOWED
#   gatewayEgress.insecureHttpAllowed
#                                 -> AGENTA_GATEWAYS_INSECURE_HTTP_ALLOWED
#   gatewayCredentials.ttlSeconds -> AGENTA_GATEWAYS_CREDENTIALS_TTL_SECONDS
#
# Docs: https://docs.agenta.ai/self-host/reference/configuration#agenta-gateways
# ================================================================== #

# The MCP gateway lets an agent reach an MCP server through Agenta, so the
# server's credential stays on your deployment instead of travelling into
# the sandbox. On by default. Off, the API refuses every MCP gateway route,
# the web container hides the MCP settings tab, and an agent dials its
# declared MCP servers directly.
mcpGateway:
  enabled: true
  # Hosts the gateway's outbound guard admits even when they would otherwise
  # be refused (a private address, a name that is not public), both when a URL
  # is saved and when the relay calls it. This only narrows anything while
  # gatewayEgress.insecureAllowed is false; with it true, every target is
  # admitted already. A list here, rendered as the comma-separated string the
  # application parses; a plain string works too. Empty by default, so nothing
  # extra is admitted.
  hostAllowlist: []
  # hostAllowlist:
  #   - mcp.internal
  #   - 10.0.0.5

# The LLM gateway does the same for model calls, keeping your provider key
# out of the sandbox. OFF by default: turning it on changes how every model
# call in the project is routed, and an upgrade should not make that change
# for you. While it is off, a model call resolves the project's stored
# provider key and injects it into the run, as before.
llmGateway:
  enabled: false

# Two guards on the gateway's outbound boundary. Both are left unset on
# purpose, so the application's own defaults apply and a chart upgrade does
# not change either one. Those defaults require https and refuse a private
# or loopback address.
#
# Set insecureAllowed: true if an MCP server in one of your projects sits on
# a private network or answers over plain http. It lifts the https
# requirement and the address check for every gateway target, at save time
# and at call time. On a deployment where people you do not trust can create
# MCP connections, leave it unset and name the one server you want reachable
# in mcpGateway.hostAllowlist instead.
#
# Set insecureHttpAllowed: true if your own Agenta deployment is reached over
# plain http at an address that is not loopback, such as an IP or a LAN name.
# It lets a run's gateway credential travel there, which otherwise fails with
# `gateway_insecure_endpoint`. This is the hop into Agenta, not the hop out
# to an MCP server. Read by the services and runner containers only.
# gatewayEgress:
#   insecureAllowed: true
#   insecureHttpAllowed: true

# How long the sandbox-scoped gateway credential a run carries stays valid,
# in seconds. Left unset on purpose so the application's own default (43200,
# 12 hours) applies; that default sits above the longest run Agenta lets
# finish. Lower it for a shorter-lived credential, and keep it above the
# longest turn you expect: a turn still running when the credential expires
# starts failing its gateway calls.
# gatewayCredentials:
#   ttlSeconds: 43200

# ================================================================== #
# docker (compose-only — no-op on Kubernetes, kept commented so the
# helm surface mirrors the compose env without taking effect here).
# ================================================================== #
# docker:
#   networkMode: "bridge"

# ================================================================== #
# postgres — connection settings.
# The compose example ships POSTGRES_PASSWORD=password as the default
# for the bundled postgres deployment.  Mirror that here so the chart
# renders out-of-the-box; production users must override.
# ================================================================== #
postgres:
  password: "password"

# ================================================================== #
# posthog
# ================================================================== #
posthog:
  apiKey: "phc_hmVSxIjTW1REBHXgj2aw4HW9X6CXb6FzerBgP9XenC7"

# ================================================================== #
# postgresql (Bitnami subchart) — bundled deployment.
#  - enabled: required for the subchart's Chart.yaml condition to fire
#  - auth.username: lines up with what the chart-managed pgauth Secret
#    and the Agenta connection URIs expect
#  - primary.persistence.size: pinned so the Bitnami default never
#    floats (volumeClaimTemplates is immutable on a StatefulSet)
#  - primary.initdb.scriptsConfigMap: points Bitnami at the chart-
#    managed initdb ConfigMap that creates agenta_{core,tracing,supertokens}.
#    The single-quoted tpl expression is rendered by the Bitnami subchart
#    at install time (Helm does not tpl-render values.yaml itself).
#  - global.postgresql.auth.{existingSecret,secretKeys}: tell Bitnami to
#    read POSTGRES_PASSWORD from the chart-managed `<release>-pgauth`
#    Secret instead of generating its own
# ================================================================== #
postgresql:
  enabled: true
  auth:
    username: "agenta"
  primary:
    initdb:
      scriptsConfigMap: '{{ printf "%s-postgresql-initdb" .Release.Name }}'
    persistence:
      size: "10Gi"

global:
  postgresql:
    auth:
      existingSecret: '{{ printf "%s-pgauth" .Release.Name }}'
      secretKeys:
        userPasswordKey: "POSTGRES_PASSWORD"
        adminPasswordKey: "POSTGRES_PASSWORD"

# ================================================================== #
# redisDurable — bundled redis StatefulSet, durable queue.
#  - persistence.size: pinned for the same reason postgres is pinned;
#    a floating default would break upgrades because volumeClaimTemplates
#    is immutable on a StatefulSet.
# ================================================================== #
# redisVolatile / redisDurable / supertokens each run a single replica and hold state, so
# losing the pod takes the component down. Each carries
# `cluster-autoscaler.kubernetes.io/safe-to-evict: "false"` so a cluster autoscaler does not
# remove its node during consolidation. Set `safeToEvict: true` on a component to opt out, or
# set `podAnnotations` to override the annotation outright. Neither key affects an operator
# drain. On GKE Autopilot the annotation also delays automatic node upgrades for that node,
# and GKE may evict the pod anyway after about seven days: treat it as a strong preference,
# not a guarantee, and keep the single-replica data stores backed up regardless.
#   redisVolatile:
#     safeToEvict: false        # default; true lets the autoscaler consolidate the node
#     podAnnotations: {}        # merged over the default, so a key set here wins
# Both bundled Redis instances probe startup every five seconds and restart after
# 60 failures by default (about five minutes). The durable instance must replay its
# append-only file before ping succeeds. Measure recovery with your CPU/storage limits
# and allow enough time, or restarts can repeat the same unfinished replay.
# Increase the threshold per instance without changing the error-aware ping command:
#   redisDurable:
#     startupProbe:
#       failureThreshold: 360  # example: about 30 minutes, not a recovery guarantee
# The same key works on redisVolatile; it leaves the other instance's threshold alone.
redisDurable:
  persistence:
    size: "5Gi"

# An external durable Redis over TLS.
#
# Set `caCert` only when the service presents a certificate from an authority the
# client does not already trust. Then `rediss://` fails with
# CERTIFICATE_VERIFY_FAILED until you supply that authority. Google Cloud
# Memorystore is the case we measured: it signs with a per-instance authority, and
# the connection is refused without it. Managed services that present a publicly
# trusted certificate need nothing here, so do not go looking for a CA you do not
# need. Check your provider's documentation, or try the connection first and add
# the authority only if it is refused.
#
# Put the authority in `redisDurable.external.caCert` and the chart mounts it at
# /etc/agenta/redis-durable/ca.pem on every workload that talks to the durable
# Redis: api, services, cron, the two workers and the alembic job. Then point the
# connection string at that path. `ssl_ca_certs` is a redis-py query parameter.
#
# redisDurable:
#   enabled: false
#   password: from-existing-secret   # defines REDIS_DURABLE_PASSWORD from the Secret
#   external:
#     uri: "rediss://:$(REDIS_DURABLE_PASSWORD)@redis.internal.example.com:6378/0?ssl_ca_certs=/etc/agenta/redis-durable/ca.pem"
#     caCert: |
#       -----BEGIN CERTIFICATE-----
#       ...
#       -----END CERTIFICATE-----
#
# With `secrets.existingSecret` the chart writes no Secret, so put the PEM in
# that Secret yourself under the key REDIS_DURABLE_CA_CERT and set
# `caCert: from-existing-secret` so the chart still mounts it.
#
# Do NOT reach for `?ssl_cert_reqs=none` instead. The traffic stays encrypted,
# but nothing then proves the server is the server, and the AUTH password is
# handed to whatever answers that address.

# ================================================================== #
# store — object store (AGENTA_STORE_*).
# Docs: https://docs.agenta.ai/self-host/configuration#store-durable-object-store
# ================================================================== #
# store:
#   endpointUrl: https://store.example.com
#   stsEndpointUrl:
#   accessKey:
#   secretKey:
#   region:
#   bucket:
#   namespace:  # optional key prefix ("database") to share one bucket across ephemeral envs; unset for a dedicated bucket
#   signingKey:
#   jwtIssuer:
#   jwtPrivateKey:
#   seaweedfs:
#     enabled: false
#     port: 8333
#     ingress:         # optional public route to the bundled S3 gateway; off by default.
#       enabled: false # Set store.endpointUrl to this HTTPS host so clients outside the cluster
#       host: store.example.com   # (a Daytona sandbox) can reach the store.
#       tls:
#         - hosts: [store.example.com]
#           secretName: agenta-store-tls
#     image:
#       repository: chrislusf/seaweedfs
#       tag: "4.47"  # pinned — IAM regressed in other releases; 4.42 is the floor for
#                    # versioned deletes (older builds leave deleted files listed but unreadable)
#       pullPolicy: IfNotPresent
#     persistence:
#       enabled: true
#       size: 20Gi

# ================================================================== #
# agentRunner — agent runner sidecar. See values.schema.json for
# the full agentRunner shape.
# ================================================================== #
# agentRunner:
#   enabled: true
#   host: "0.0.0.0"            # AGENTA_RUNNER_HOST, the bind address. Leave it alone: the runner
#                              # itself defaults to 127.0.0.1, which the kubelet cannot reach, so
#                              # the health probes fail forever and the pod never becomes ready.
#   liveFrames: true           # AGENTA_RUNNER_LIVE_FRAMES; set false to disable live-frame relay
#   replicas: 1                # default 1. More than 1 needs remote sandbox providers only: the
#                              # render fails when providers.enabled lists local. With only remote
#                              # providers the runner rolls out RollingUpdate (maxSurge 1,
#                              # maxUnavailable 0); with local it uses Recreate.
#   shutdownWaitSeconds: 200   # AGENTA_RUNNER_SHUTDOWN_WAIT_SECONDS. On SIGTERM the pod refuses
#                              # new turns, lets running ones finish for this long, cancels the
#                              # rest and deletes its sandboxes. Default with RollingUpdate: the
#                              # grace period minus 100 (never below 0), which leaves room for the
#                              # preStop delay, the cancel and the teardown. Default with Recreate
#                              # (the local provider): 0, because no new pod starts until the old
#                              # one exits. The render fails for a larger value. The
#                              # 100 assumes the default AGENTA_RUNNER_HARNESS_CANCEL_SETTLE_MS
#                              # (10 s); a larger settle time needs a shorter wait, by twice the
#                              # increase.
#   env:                       # The chart owns AGENTA_RUNNER_REPLICA_ID (always the pod name,
#                              # because pods that share an id can take the same turn) and
#                              # AGENTA_RUNNER_SHUTDOWN_WAIT_SECONDS (set it with
#                              # shutdownWaitSeconds), AGENTA_RUNNER_ENABLED_SANDBOX_PROVIDERS
#                              # and AGENTA_RUNNER_DEFAULT_SANDBOX_PROVIDER (set them with
#                              # providers.enabled and providers.default). The render fails when
#                              # env or extraEnv sets any of them.
#     AGENTA_RUNNER_REPLICA_ADDRESS: ""  # chart default http://$(POD_IP):<port>, where the api
#                              # sends Stop for this pod's turns and Services sends the
#                              # session's follow-up messages. A NetworkPolicy that blocks api or
#                              # Services traffic to runner pod IPs breaks Stop and follow-up
#                              # routing. On an IPv6 single-stack cluster the pod IP needs
#                              # brackets in a URL: set "http://[$(POD_IP)]:8765" here.
#   providers:
#     enabled: [local]        # AGENTA_RUNNER_ENABLED_SANDBOX_PROVIDERS (rendered comma-joined)
#     default: local          # AGENTA_RUNNER_DEFAULT_SANDBOX_PROVIDER (must be one of enabled)
#     daytona:
#       apiKeySecretRef:       # injected as AGENTA_RUNNER_DAYTONA_API_KEY
#         name: agenta-runner-daytona
#         key: api-key
#       apiUrl: https://app.daytona.io/api
#       target: eu
#       snapshot: agenta-agent-sandbox-v2
#       autostopMinutes: 15
#       autodeleteMinutes: 30
#       sessionIdleTtlMs: ""
#       sessionMaxWarm: ""
#       opaqueSecrets: "off"           # QUOTE IT: bare off is a YAML boolean, and the template
#                                      # would then skip the variable and leave hiding ON.
#                                      # Hiding model/MCP keys from the sandbox is the DEFAULT
#                                      # and needs a Daytona API key that may manage Secrets.
#                                      # Set "off" only to send them as plain env vars instead.
#   auth:
#     tokenSecretRef:          # AGENTA_RUNNER_TOKEN; Services sends it, the runner verifies it
#       name: agenta-runner
#       key: token
#   fuse:
#     enabled: true            # default true. With store.enabled=true the runner container gets
#                              # the SYS_ADMIN capability and a hostPath mount of /dev/fuse, which
#                              # geesefs needs for a local sandbox.
#                              # GKE Autopilot rejects both, so set this to false there and run
#                              # sandboxes on the Daytona provider:
#                              #   agentRunner.fuse.enabled: false
#                              #   agentRunner.providers.enabled: [daytona]
#                              #   agentRunner.providers.default: daytona
#   lifecycle:                 # default: a preStop exec hook that runs `sleep 10`. The default
#                              # image (node:24-slim) has `sleep`. A custom image without it must
#                              # set its own hook here, or the drain delay is skipped on shutdown.

# ================================================================== #
# Graceful rollouts — per-workload.
# A managed load balancer keeps sending requests to a pod for a few
# seconds after Kubernetes removes it from the endpoints, so a pod that
# exits at once answers them with 502. Hold the pod open with a preStop
# hook, give it room with a grace period, and keep a spare pod during
# the rollout with a strategy. See hosting/kubernetes/README.md.
# Chart defaults when a key is unset:
#   strategy: Recreate on cron and redisVolatile, and on agentRunner when its
#     providers include local; RollingUpdate with maxUnavailable 0, maxSurge 1
#     on services, web, webMobile, workerStreams, workerQueues, supertokens,
#     api, and agentRunner with remote providers only.
#   terminationGracePeriodSeconds: 300 on agentRunner, 120 on the two
#     workers, 60 on services, web and webMobile. On api it is
#     api.gunicorn.gracefulTimeout plus 30 (930 by default), so a long LLM
#     gateway stream can finish; see "api.gunicorn" below.
#   lifecycle: a preStop exec `sleep 10` on agentRunner, api, services, web and
#     webMobile. Setting a key replaces its default.
# Liveness probes on cron, workerStreams and workerQueues come from the heartbeat file.
# See the `heartbeat` section near the top of this file for what each one proves. Setting
# `<workload>.livenessProbe` replaces the generated probe for that workload:
#
#   workerQueues:
#     livenessProbe:
#       httpGet:
#         path: /healthz
#         port: 8080
#
# The keys work on api, services, web, webMobile, cron, workerStreams,
# workerQueues, agentRunner, supertokens, redisVolatile, redisDurable,
# store.seaweedfs and alembic. `strategy` is for Deployments only.
# ================================================================== #
# api:
#   gunicorn:                  # the api's gunicorn worker lifecycle (defaults shown)
#     gracefulTimeout: 900     # seconds a recycled or stopped worker gets to finish its
#                              # open requests. Must cover the longest LLM gateway stream.
#                              # GKE Autopilot caps the pod grace period at 600 s: there,
#                              # use 560 and terminationGracePeriodSeconds 600.
#     maxRequests: 100000      # recycle a worker after this many requests (leak guard)
#     maxRequestsJitter: 10000 # spread the recycles so workers do not drain together
#     timeout: 60              # hung-worker check, not a request limit
#   terminationGracePeriodSeconds: 45   # default: gunicorn.gracefulTimeout + 30
#   lifecycle:
#     preStop:
#       sleep:
#         seconds: 10   # needs Kubernetes 1.30+; use an exec hook below 1.30
#   strategy:
#     rollingUpdate:
#       maxUnavailable: 0

# ================================================================== #
# networkPolicy — lock the bundled data stores down to this release.
# Off by default. When on, the chart renders one NetworkPolicy per
# bundled store it deploys (redis-volatile, redis-durable, seaweedfs).
# The bundled PostgreSQL is not covered; the Bitnami subchart owns its
# own policy. See hosting/kubernetes/README.md.
# ================================================================== #
# networkPolicy:
#   enabled: false
#   extraIngressFrom:            # raw NetworkPolicy `from:` entries
#     - ipBlock:
#         cidr: 130.211.0.0/22   # Google Cloud health checkers
#     - ipBlock:
#         cidr: 35.191.0.0/16

# ================================================================== #
# Availability under disruption
#
# Kubernetes moves pods off a node whenever the platform needs that node: an
# upgrade, a repair, or a scale-down that packs pods onto fewer nodes. On GKE
# Autopilot that happens with no warning and is not a fault. A workload with
# one replica is unreachable while its pod starts somewhere else, which took
# about three minutes on a stage cluster on 2026-10-03.
#
# The chart answers that with two objects, both on by default:
#
#   * a PodDisruptionBudget per workload. Two or more replicas get
#     `maxUnavailable: 1`. One replica gets a budget only when you ask for it
#     with `<workload>.pdb.protectSingleton: true`, because a budget over a
#     single pod defers every voluntary eviction of its node rather than
#     keeping the workload up. Autopilot honours a budget for one hour during
#     a node upgrade and never for a node that fails outright.
#   * topologySpreadConstraints for every workload with two or more replicas:
#     one pod per node (hard) and an even spread over zones (soft), scoped to
#     one revision so a rolling update is not blocked by the pods it replaces.
#
# NOTHING here makes a single replica highly available. Give any workload that
# must stay reachable `replicas: 2`.
#
#   podDisruptionBudgets:
#     enabled: true          # false removes every budget
#   topologySpread:
#     enabled: true          # false removes every generated constraint
#
#   api:
#     replicas: 2
#     pdb:
#       maxUnavailable: 1    # or minAvailable; overrides the default
#   agentRunner:
#     pdb:
#       protectSingleton: true        # defer eviction of the only runner pod
#     topologySpreadConstraints: []   # replace the generated list entirely
#
# Cron and the volatile redis default to `strategy: Recreate`. Cron, because
# supercronic fires every schedule in every pod. Redis, because two caches serve
# different answers. The runner uses Recreate only with the local provider,
# whose sandboxes run inside the runner pod.
# ================================================================== #

# ================================================================== #
# workers — topology A (workers-sprawl); see docs/designs/workers-sprawl/specs.md
# `streams`/`queues` = selector lists; empty ⇒ all loops in that kind.
# ================================================================== #
workerStreams:
  enabled: true
  replicas: 1
  # streams: "tracing"
workerQueues:
  enabled: true
  replicas: 1
  # queues: "evaluations"
