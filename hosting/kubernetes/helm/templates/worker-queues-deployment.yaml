{{- $values := include "agenta.values" . | fromYaml -}}
{{- $workerQueues := default dict $values.workerQueues -}}
{{- $newrelic := default dict $values.newrelic -}}
{{- if eq (include "agenta.workerQueues.enabled" .) "true" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agenta.fullname" . }}-worker-queues
  labels:
    {{- include "agenta.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker-queues
spec:
  replicas: {{ include "agenta.workerQueues.replicas" . }}
  {{- with $workerQueues.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- else }}
  {{- /* Default: never take a pod down before its replacement is ready. The
         Kubernetes default of 25% unavailable rounds to "the only pod" when a
         workload runs one replica, which is a deliberate outage on every
         rollout. */}}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "agenta.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker-queues
  template:
    metadata:
      labels:
        {{- include "agenta.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker-queues
    spec:
      {{- include "agenta.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "agenta.serviceAccountName" . }}
      {{- if hasKey $workerQueues "terminationGracePeriodSeconds" }}
      terminationGracePeriodSeconds: {{ $workerQueues.terminationGracePeriodSeconds }}
      {{- else }}
      {{- /* Default 120 s: a consumer should finish the item it holds. */}}
      terminationGracePeriodSeconds: 120
      {{- end }}
      {{- with $workerQueues.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $init := include "agenta.initContainers" . }}
      {{- if $init }}
      initContainers:
        {{- $init | nindent 8 }}
      {{- end }}
      containers:
        - name: worker-queues
          image: {{ include "agenta.apiImage" . }}
          imagePullPolicy: {{ include "agenta.api.pullPolicy" . }}
          {{- with $workerQueues.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: {{ if $newrelic.licenseKey }}["newrelic-admin", "run-program", "python", "-m", "entrypoints.worker_queues"]{{ else }}["python", "-m", "entrypoints.worker_queues"]{{ end }}
          env:
            {{- include "agenta.commonEnv" . | nindent 12 }}
            # empty ⇒ all queue loops; see docs/designs/workers-sprawl/specs.md
            - name: AGENTA_WORKER_QUEUES
              value: {{ default "" $workerQueues.queues | quote }}
            {{- range $key, $val := $workerQueues.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            {{- /* extraEnv is a raw list of explicit Kubernetes env entries, so valueFrom works
                   and names here override earlier chart entries. envFrom pulls whole Secrets or
                   ConfigMaps, but Kubernetes uses those values only for names absent from env. */}}
            {{- with $workerQueues.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $workerQueues.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- /* No liveness probe by default. The one that used to be here ran `pgrep`,
                 which is not in the image, so it could never start: the kubelet reported
                 "Liveness probe errored and resulted in unknown state" every period. It
                 would add nothing even if it ran, because the queue worker is PID 1 in this
                 container, and a container whose PID 1 exits is restarted already.

                 A probe that catches the failure that matters here, a process that is
                 alive and no longer working, needs a heartbeat from the application. There
                 is none yet (agenta#7334). Until then, supply your own probe if you have a
                 signal to check. */}}
          {{- with $workerQueues.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $workerQueues.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $workerQueues.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with $workerQueues.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $workerQueues.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $workerQueues.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $spread := include "agenta.topologySpreadConstraints" (dict "root" $ "component" "worker-queues" "key" "workerQueues" "replicas" (include "agenta.workerQueues.replicas" .)) }}
      {{- if $spread }}
      topologySpreadConstraints:
        {{- $spread | nindent 8 }}
      {{- end }}
{{- end }}
