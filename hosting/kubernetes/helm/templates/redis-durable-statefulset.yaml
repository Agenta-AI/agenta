{{- $values := include "agenta.values" . | fromYaml -}}
{{- $redisDurable := default dict $values.redisDurable -}}
{{- $persistence := default dict $redisDurable.persistence -}}
{{- $persistenceEnabled := true -}}
{{- if hasKey $persistence "enabled" -}}
{{- $persistenceEnabled = $persistence.enabled -}}
{{- end -}}
{{- if eq (include "agenta.redisDurable.enabled" .) "true" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "agenta.fullname" . }}-redis-durable
  labels:
    {{- include "agenta.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis-durable
spec:
  serviceName: {{ include "agenta.fullname" . }}-redis-durable
  replicas: 1
  selector:
    matchLabels:
      {{- include "agenta.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis-durable
  template:
    metadata:
      {{- /* A single-replica pod that holds state: the cluster autoscaler consolidating its node
             takes the whole component down. On GKE it evicted redis-volatile and supertokens
             mid-traffic and every agent turn was refused until the replacement pod was ready.
             The annotation makes the autoscaler skip that node for scale-down. It does not
             block an operator drain. On GKE Autopilot it also DELAYS automatic node upgrades
             for that node, and GKE may evict the pod anyway after about seven days, so it is a
             strong preference, not a guarantee. It is inert where no autoscaler runs. Set
             `$redisDurable.safeToEvict: true` to opt out, or override the key through
             `$redisDurable.podAnnotations`. */}}
      {{- $annotations := dict "cluster-autoscaler.kubernetes.io/safe-to-evict" (ternary "true" "false" (default false $redisDurable.safeToEvict)) -}}
      {{- $annotations = merge (deepCopy (default dict $redisDurable.podAnnotations)) $annotations }}
      annotations:
        {{- toYaml $annotations | nindent 8 }}
      labels:
        {{- include "agenta.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis-durable
    spec:
      {{- include "agenta.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "agenta.serviceAccountName" . }}
      {{- if hasKey $redisDurable "terminationGracePeriodSeconds" }}
      terminationGracePeriodSeconds: {{ $redisDurable.terminationGracePeriodSeconds }}
      {{- end }}
      {{- with $redisDurable.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: redis
          image: {{ include "agenta.redisDurableImage" . }}
          imagePullPolicy: {{ include "agenta.redisDurable.pullPolicy" . }}
          {{- with $redisDurable.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - sh
            - -c
            - >-
              exec redis-server
              --appendonly yes
              --appendfsync no
              --aof-load-corrupt-tail-max-size {{ include "agenta.redisDurable.aofLoadCorruptTailMaxSize" . }}
              --save ""
              --maxmemory {{ include "agenta.redisDurable.maxmemory" . | quote }}
              --maxmemory-policy {{ include "agenta.redisDurable.maxmemoryPolicy" . }}
              --port {{ include "agenta.redisDurable.port" . | quote }}
              {{- if $redisDurable.password }}
              --requirepass "$REDIS_DURABLE_PASSWORD"
              {{- end }}
          ports:
            - name: redis
              containerPort: {{ include "agenta.redisDurable.port" . }}
              protocol: TCP
          {{- if $persistenceEnabled }}
          volumeMounts:
            - name: redis-data
              mountPath: /data
          {{- end }}
          {{- if $redisDurable.password }}
          env:
            - name: REDIS_DURABLE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "agenta.secretName" . }}
                  key: REDIS_DURABLE_PASSWORD
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ include "agenta.secretName" . }}
                  key: REDIS_DURABLE_PASSWORD
          {{- end }}
          {{- /* A startup probe, so a restart that has to replay the
                 append-only file is not killed by liveness while it works.
                 Liveness and readiness only begin once this passes. */}}
          {{- /* -e makes redis-cli exit non-zero on an error REPLY, not just on a
                 connection failure. Without it `ping` exits 0 while the server answers
                 LOADING during an AOF replay, so a probe reported a loading instance as
                 healthy. Measured in a running pod: `redis-cli get` with no argument
                 exits 0 without -e and 1 with it. */}}
          startupProbe:
            exec:
              command: ["redis-cli", "-e", "-p", {{ include "agenta.redisDurable.port" . | quote }}, "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["redis-cli", "-e", "-p", {{ include "agenta.redisDurable.port" . | quote }}, "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command: ["redis-cli", "-e", "-p", {{ include "agenta.redisDurable.port" . | quote }}, "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          {{- with $redisDurable.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $redisDurable.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with $redisDurable.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $redisDurable.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $redisDurable.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if $persistenceEnabled }}
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if hasKey $persistence "storageClass" }}
        storageClassName: {{ $persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ default "5Gi" $persistence.size }}
  {{- end }}
{{- end }}
