{{- $values := include "agenta.values" . | fromYaml -}}
{{- $cron := default dict $values.cron -}}
{{- if eq (include "agenta.cron.enabled" .) "true" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agenta.fullname" . }}-cron
  labels:
    {{- include "agenta.labels" . | nindent 4 }}
    app.kubernetes.io/component: cron
spec:
  replicas: {{ include "agenta.cron.replicas" . }}
  {{- with $cron.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- else }}
  {{- /* Recreate, not RollingUpdate: supercronic does not coordinate across
         pods, so two of them fire every schedule twice. A rolling update
         overlaps old and new for a few seconds, which is enough to double a
         job that happens to be due. The cost is a scheduling gap of one pod
         start, which a cron job tolerates and a duplicate side effect does
         not. */}}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "agenta.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: cron
  template:
    metadata:
      labels:
        {{- include "agenta.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: cron
    spec:
      {{- include "agenta.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "agenta.serviceAccountName" . }}
      {{- if hasKey $cron "terminationGracePeriodSeconds" }}
      terminationGracePeriodSeconds: {{ $cron.terminationGracePeriodSeconds }}
      {{- end }}
      {{- with $cron.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: cron
          image: {{ include "agenta.apiImage" . }}
          imagePullPolicy: {{ include "agenta.api.pullPolicy" . }}
          {{- with $cron.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ["/usr/local/bin/supercronic", "/app/crontab"]
          env:
            {{- include "agenta.commonEnv" . | nindent 12 }}
            {{- range $key, $val := $cron.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            {{- /* extraEnv is a raw list of explicit Kubernetes env entries, so valueFrom works
                   and names here override earlier chart entries. envFrom pulls whole Secrets or
                   ConfigMaps, but Kubernetes uses those values only for names absent from env. */}}
            {{- with $cron.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $cron.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- /* No liveness probe by default. The one that used to be here ran `pgrep`,
                 which is not in the image, so it could never start: the kubelet reported
                 "Liveness probe errored and resulted in unknown state" every period. It
                 would add nothing even if it ran, because supercronic is PID 1 in this
                 container, and a container whose PID 1 exits is restarted already.

                 A probe that catches the failure that matters here, a process that is
                 alive and no longer working, needs a progress signal from the application.
                 There is a partial one: run_worker_heartbeat in the evaluations runtime,
                 started by entrypoints/worker_queues.py. It is not enough to probe on. It
                 runs on its own timer rather than with task progress, it only exists when
                 that queue is enabled, and it covers neither the stream loops nor cron.
                 Nothing consumes it. Until a signal covers all three workloads, supply
                 your own probe if you have one worth checking (agenta#7334). */}}
          {{- with $cron.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $cron.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $cron.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- $redisCaMount := include "agenta.redisDurableCaVolumeMount" . }}
          {{- if $redisCaMount }}
          volumeMounts:
            {{- $redisCaMount | nindent 12 }}
          {{- end }}
      {{- $redisCaVolume := include "agenta.redisDurableCaVolume" . }}
      {{- if $redisCaVolume }}
      volumes:
        {{- $redisCaVolume | nindent 8 }}
      {{- end }}
      {{- with $cron.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $cron.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $cron.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $spread := include "agenta.topologySpreadConstraints" (dict "root" $ "component" "cron" "key" "cron" "replicas" (include "agenta.cron.replicas" .)) }}
      {{- if $spread }}
      topologySpreadConstraints:
        {{- $spread | nindent 8 }}
      {{- end }}
{{- end }}
