{{- $values := include "agenta.values" . | fromYaml -}}
{{- $alembic := default dict $values.alembic -}}
{{- if eq (include "agenta.alembic.enabled" .) "true" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "agenta.fullname" . }}-alembic
  labels:
    {{- include "agenta.labels" . | nindent 4 }}
    app.kubernetes.io/component: alembic
  annotations:
    # alembic.hookPhase picks the phase; the default "post" is the behavior the
    # chart always had.
    #
    # post-install/post-upgrade is the right default with the BUNDLED PostgreSQL:
    # pre-install hooks run before any release resource is created, so the
    # PostgreSQL StatefulSet would not exist yet and the migration job would
    # deadlock waiting for the database.  The tradeoff is that application pods
    # may briefly start against an unmigrated schema; their init-containers wait
    # for PostgreSQL readiness but not for Alembic completion.  In practice this
    # is acceptable because the migration job finishes within seconds and
    # Kubernetes will restart any pods that fail their startup probes during
    # that window.
    #
    # With an EXTERNAL database (postgresql.enabled=false) the deadlock cannot
    # happen, and that brief unmigrated window is worth closing.  Set
    # alembic.hookPhase: pre to run the migrations before the app pods start.
    {{- if eq (include "agenta.alembic.hookPhase" .) "pre" }}
    helm.sh/hook: pre-install,pre-upgrade
    {{- else }}
    helm.sh/hook: post-install,post-upgrade
    {{- end }}
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  activeDeadlineSeconds: {{ include "agenta.alembic.activeDeadlineSeconds" . }}
  backoffLimit: {{ include "agenta.alembic.backoffLimit" . }}
  ttlSecondsAfterFinished: {{ include "agenta.alembic.ttlSecondsAfterFinished" . }}
  template:
    metadata:
      labels:
        {{- include "agenta.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: alembic
    spec:
      {{- include "agenta.imagePullSecrets" . | nindent 6 }}
      {{- /* On a FRESH INSTALL in the pre phase this Job runs before any release resource is
             applied, so the ServiceAccount the chart creates does not exist yet. A pod that
             names a missing ServiceAccount is refused ("serviceaccount <name> not found"),
             the Job never starts a pod, and `helm install` sits in pending-install until it
             times out.

             The migration talks to PostgreSQL only and needs no Kubernetes API access, so on
             that one install the Job names no ServiceAccount at all. The pod lands on the
             namespace's default ServiceAccount, which Kubernetes creates with the namespace,
             and mounts no token.

             Two cases keep naming the ServiceAccount, because there it already exists:

             - An UPGRADE. The first install created the ServiceAccount, so the pre-upgrade
               hook can name it. Naming it also keeps the identity the operator configured.
               serviceAccount.annotations is how a GKE release binds the workload identity
               that reaches Cloud SQL with IAM auth, and a controller that patches pull
               secrets onto ServiceAccounts patches this one. Falling back to the namespace's
               default ServiceAccount on every upgrade would drop both.
             - An operator-supplied ServiceAccount (serviceAccount.create: false), which
               exists before the install.

             So a fresh install that needs a named identity for the migration itself must
             pre-create the ServiceAccount and set serviceAccount.create: false. A cluster
             that requires a named ServiceAccount by policy needs the same. The README
             section "An external PostgreSQL" says so.

             Making the ServiceAccount itself a pre-install hook would also work on a fresh
             install, and is wrong afterwards: a hook resource leaves the release manifest, so
             the delete policy governs its lifetime, and switching alembic.hookPhase later
             flips the object between hook and tracked resource, which breaks the next
             `helm upgrade` on ownership metadata. */}}
      {{- if and .Release.IsInstall (eq (include "agenta.alembic.hookPhase" .) "pre") (eq (include "agenta.serviceAccount.create" .) "true") }}
      automountServiceAccountToken: false
      {{- else }}
      serviceAccountName: {{ include "agenta.serviceAccountName" . }}
      {{- end }}
      {{- if hasKey $alembic "terminationGracePeriodSeconds" }}
      terminationGracePeriodSeconds: {{ $alembic.terminationGracePeriodSeconds }}
      {{- end }}
      {{- with $alembic.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      {{- if eq (include "agenta.postgresql.enabled" .) "true" }}
      initContainers:
        {{- include "agenta.waitForPostgres" . | nindent 8 }}
      {{- end }}
      containers:
        - name: alembic
          image: {{ include "agenta.apiImage" . }}
          imagePullPolicy: {{ include "agenta.api.pullPolicy" . }}
          {{- with $alembic.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - sh
            - -c
            - {{ printf "python -m %s" (include "agenta.alembicRunnerModule" .) | quote }}
          env:
            {{- include "agenta.commonEnv" . | nindent 12 }}
            - name: ALEMBIC_AUTO_MIGRATIONS
              {{- if hasKey $alembic "autoMigrations" }}
              value: {{ $alembic.autoMigrations | quote }}
              {{- else }}
              value: "true"
              {{- end }}
            - name: ALEMBIC_CFG_PATH_CORE
              value: {{ include "agenta.alembicCfgPathCore" . | quote }}
            - name: ALEMBIC_CFG_PATH_TRACING
              value: {{ include "agenta.alembicCfgPathTracing" . | quote }}
            {{- range $key, $val := $alembic.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            {{- /* extraEnv is a raw list of explicit Kubernetes env entries, so valueFrom works
                   and names here override earlier chart entries. envFrom pulls whole Secrets or
                   ConfigMaps, but Kubernetes uses those values only for names absent from env. */}}
            {{- with $alembic.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $alembic.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $alembic.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $alembic.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with $alembic.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $alembic.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $alembic.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
