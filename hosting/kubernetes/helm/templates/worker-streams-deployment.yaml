{{- $values := include "agenta.values" . | fromYaml -}}
{{- $workerStreams := default dict $values.workerStreams -}}
{{- $newrelic := default dict $values.newrelic -}}
{{- if eq (include "agenta.workerStreams.enabled" .) "true" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agenta.fullname" . }}-worker-streams
  labels:
    {{- include "agenta.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker-streams
spec:
  replicas: {{ include "agenta.workerStreams.replicas" . }}
  {{- with $workerStreams.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- else }}
  {{- /* Default: never take a pod down before its replacement is ready. The
         Kubernetes default of 25% unavailable rounds to "the only pod" when a
         workload runs one replica, which is a deliberate outage on every
         rollout. */}}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "agenta.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker-streams
  template:
    metadata:
      labels:
        {{- include "agenta.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker-streams
    spec:
      {{- include "agenta.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "agenta.serviceAccountName" . }}
      {{- if hasKey $workerStreams "terminationGracePeriodSeconds" }}
      terminationGracePeriodSeconds: {{ $workerStreams.terminationGracePeriodSeconds }}
      {{- else }}
      {{- /* Default 120 s: a consumer should finish the item it holds. */}}
      terminationGracePeriodSeconds: 120
      {{- end }}
      {{- with $workerStreams.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $init := include "agenta.initContainers" . }}
      {{- if $init }}
      initContainers:
        {{- $init | nindent 8 }}
      {{- end }}
      containers:
        - name: worker-streams
          image: {{ include "agenta.apiImage" . }}
          imagePullPolicy: {{ include "agenta.api.pullPolicy" . }}
          {{- with $workerStreams.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: {{ if $newrelic.licenseKey }}["newrelic-admin", "run-program", "python", "-m", "entrypoints.worker_streams"]{{ else }}["python", "-m", "entrypoints.worker_streams"]{{ end }}
          env:
            {{- include "agenta.commonEnv" . | nindent 12 }}
            # empty ⇒ all stream loops; see docs/designs/workers-sprawl/specs.md
            - name: AGENTA_WORKER_STREAMS
              value: {{ default "" $workerStreams.streams | quote }}
            {{- range $key, $val := $workerStreams.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            {{- /* extraEnv is a raw list of explicit Kubernetes env entries, so valueFrom works
                   and names here override earlier chart entries. envFrom pulls whole Secrets or
                   ConfigMaps, but Kubernetes uses those values only for names absent from env. */}}
            {{- with $workerStreams.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $workerStreams.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- /* No liveness probe by default. The one that used to be here ran `pgrep`,
                 which is not in the image, so it could never start: the kubelet reported
                 "Liveness probe errored and resulted in unknown state" every period. It
                 would add nothing even if it ran, because the stream worker is PID 1 in this
                 container, and a container whose PID 1 exits is restarted already.

                 A probe that catches the failure that matters here, a process that is
                 alive and no longer working, needs a progress signal from the application.
                 There is a partial one: run_worker_heartbeat in the evaluations runtime,
                 started by entrypoints/worker_queues.py. It is not enough to probe on. It
                 runs on its own timer rather than with task progress, it only exists when
                 that queue is enabled, and it covers neither the stream loops nor cron.
                 Nothing consumes it. Until a signal covers all three workloads, supply
                 your own probe if you have one worth checking (agenta#7334). */}}
          {{- with $workerStreams.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $workerStreams.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $workerStreams.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with $workerStreams.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $workerStreams.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $workerStreams.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $spread := include "agenta.topologySpreadConstraints" (dict "root" $ "component" "worker-streams" "key" "workerStreams" "replicas" (include "agenta.workerStreams.replicas" .)) }}
      {{- if $spread }}
      topologySpreadConstraints:
        {{- $spread | nindent 8 }}
      {{- end }}
{{- end }}
