{{- $values := include "agenta.values" . | fromYaml -}}
{{- $api := default dict $values.api -}}
{{- $newrelic := default dict $values.newrelic -}}
{{- if eq (include "agenta.api.enabled" .) "true" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agenta.fullname" . }}-api
  labels:
    {{- include "agenta.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ include "agenta.api.replicas" . }}
  {{- /* Graceful rollouts. A managed load balancer (GKE) keeps sending requests to a pod
         for a few seconds after Kubernetes removes it from the endpoints, so a pod that
         exits at once answers them with 502. Three optional keys fix that, and all three
         are unset by default: `strategy` (spec.strategy, e.g. maxUnavailable: 0),
         `lifecycle` (a preStop hook that delays the shutdown) and
         `terminationGracePeriodSeconds` (room for that delay). See the README section
         "Graceful rollouts". */}}
  {{- with $api.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "agenta.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "agenta.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      {{- include "agenta.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "agenta.serviceAccountName" . }}
      {{- if hasKey $api "terminationGracePeriodSeconds" }}
      terminationGracePeriodSeconds: {{ $api.terminationGracePeriodSeconds }}
      {{- end }}
      {{- with $api.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $init := include "agenta.initContainers" . }}
      {{- if $init }}
      initContainers:
        {{- $init | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "agenta.apiImage" . }}
          imagePullPolicy: {{ include "agenta.api.pullPolicy" . }}
          {{- with $api.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            {{- if $newrelic.licenseKey }}
            - newrelic-admin
            - run-program
            {{- end }}
            - gunicorn
            - entrypoints.routers:app
            - --bind
            - 0.0.0.0:{{ include "agenta.api.port" . }}
            - --worker-class
            - uvicorn.workers.UvicornWorker
            - --workers
            - {{ include "agenta.api.workers" . | quote }}
            - --max-requests
            - "10000"
            - --max-requests-jitter
            - "1000"
            - --timeout
            - "60"
            - --graceful-timeout
            - "60"
            - --log-level
            - info
            - --access-logfile
            - "-"
            - --error-logfile
            - "-"
          ports:
            - name: http
              containerPort: {{ include "agenta.api.port" . }}
              protocol: TCP
          env:
            {{- include "agenta.commonEnv" . | nindent 12 }}
            {{- include "agenta.servicesInternalEnv" . | nindent 12 }}
            - name: SCRIPT_NAME
              value: "/api"
            {{- include "agenta.agentRunner.servicesEnv" . | nindent 12 }}
            {{- range $key, $val := $api.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            {{- /* extraEnv is a raw list of explicit Kubernetes env entries, so valueFrom works
                   and names here override earlier chart entries. envFrom pulls whole Secrets or
                   ConfigMaps, but Kubernetes uses those values only for names absent from env. */}}
            {{- with $api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $api.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          {{- with $api.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $api.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with $api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
