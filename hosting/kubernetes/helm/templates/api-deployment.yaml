{{- $values := include "agenta.values" . | fromYaml -}}
{{- $api := default dict $values.api -}}
{{- $newrelic := default dict $values.newrelic -}}
{{- if eq (include "agenta.api.enabled" .) "true" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agenta.fullname" . }}-api
  labels:
    {{- include "agenta.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ include "agenta.api.replicas" . }}
  {{- /* Graceful rollouts. A managed load balancer (GKE) keeps sending requests to a pod
         for a few seconds after Kubernetes removes it from the endpoints, so a pod that
         exits at once answers them with 502. The api is the workload that serves those
         requests. Kubernetes defaults to RollingUpdate with maxUnavailable: 25% and
         maxSurge: 25%. For one replica, these round down to 0 unavailable pods and up
         to 1 surge pod, so the explicit 0/1 limits preserve those availability limits.
         The api previously had no preStop hook and used the default 30-second grace
         period. Now it uses the same rollout and shutdown defaults as services, web
         and webMobile. See the README section "Graceful rollouts". */}}
  {{- with $api.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- else }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "agenta.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "agenta.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      {{- include "agenta.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "agenta.serviceAccountName" . }}
      {{- if hasKey $api "terminationGracePeriodSeconds" }}
      terminationGracePeriodSeconds: {{ $api.terminationGracePeriodSeconds }}
      {{- else }}
      terminationGracePeriodSeconds: 60
      {{- end }}
      {{- with $api.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $init := include "agenta.initContainers" . }}
      {{- if $init }}
      initContainers:
        {{- $init | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "agenta.apiImage" . }}
          imagePullPolicy: {{ include "agenta.api.pullPolicy" . }}
          {{- with $api.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            {{- if $newrelic.licenseKey }}
            - newrelic-admin
            - run-program
            {{- end }}
            - gunicorn
            - entrypoints.routers:app
            - --bind
            - 0.0.0.0:{{ include "agenta.api.port" . }}
            - --worker-class
            - uvicorn.workers.UvicornWorker
            - --workers
            - {{ include "agenta.api.workers" . | quote }}
            - --max-requests
            - "10000"
            - --max-requests-jitter
            - "1000"
            - --timeout
            - "60"
            - --graceful-timeout
            - "60"
            - --log-level
            - info
            - --access-logfile
            - "-"
            - --error-logfile
            - "-"
          ports:
            - name: http
              containerPort: {{ include "agenta.api.port" . }}
              protocol: TCP
          env:
            {{- include "agenta.commonEnv" . | nindent 12 }}
            {{- include "agenta.servicesInternalEnv" . | nindent 12 }}
            - name: SCRIPT_NAME
              value: "/api"
            {{- include "agenta.agentRunner.servicesEnv" . | nindent 12 }}
            {{- range $key, $val := $api.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            {{- /* extraEnv is a raw list of explicit Kubernetes env entries, so valueFrom works
                   and names here override earlier chart entries. envFrom pulls whole Secrets or
                   ConfigMaps, but Kubernetes uses those values only for names absent from env. */}}
            {{- with $api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $api.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          {{- /* A preStop delay, so the load balancer stops choosing this pod before the
                 process goes away. Setting api.lifecycle replaces it. */}}
          lifecycle:
            {{- if $api.lifecycle }}
            {{- toYaml $api.lifecycle | nindent 12 }}
            {{- else }}
            preStop:
              exec:
                command: ["sleep", "10"]
            {{- end }}
          {{- with $api.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- $redisCaMount := include "agenta.redisDurableCaVolumeMount" . }}
          {{- if $redisCaMount }}
          volumeMounts:
            {{- $redisCaMount | nindent 12 }}
          {{- end }}
      {{- $redisCaVolume := include "agenta.redisDurableCaVolume" . }}
      {{- if $redisCaVolume }}
      volumes:
        {{- $redisCaVolume | nindent 8 }}
      {{- end }}
      {{- with $api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $spread := include "agenta.topologySpreadConstraints" (dict "root" $ "component" "api" "key" "api" "replicas" (include "agenta.api.replicas" .)) }}
      {{- if $spread }}
      topologySpreadConstraints:
        {{- $spread | nindent 8 }}
      {{- end }}
{{- end }}
