{{- $values := include "agenta.values" . | fromYaml -}}
{{- $services := default dict $values.services -}}
{{- $newrelic := default dict $values.newrelic -}}
{{- if eq (include "agenta.services.enabled" .) "true" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agenta.fullname" . }}-services
  labels:
    {{- include "agenta.labels" . | nindent 4 }}
    app.kubernetes.io/component: services
spec:
  replicas: {{ include "agenta.services.replicas" . }}
  {{- with $services.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- else }}
  {{- /* Default: never take a pod down before its replacement is ready. The
         Kubernetes default of 25% unavailable rounds to "the only pod" when a
         workload runs one replica, which is a deliberate outage on every
         rollout. */}}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "agenta.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: services
  template:
    metadata:
      labels:
        {{- include "agenta.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: services
    spec:
      {{- include "agenta.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "agenta.serviceAccountName" . }}
      {{- if hasKey $services "terminationGracePeriodSeconds" }}
      terminationGracePeriodSeconds: {{ $services.terminationGracePeriodSeconds }}
      {{- else }}
      {{- /* Default 60 s: the load balancer needs time to stop sending requests here. */}}
      terminationGracePeriodSeconds: 60
      {{- end }}
      {{- with $services.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $init := include "agenta.initContainers" . }}
      {{- if $init }}
      initContainers:
        {{- $init | nindent 8 }}
      {{- end }}
      containers:
        - name: services
          image: {{ include "agenta.servicesImage" . }}
          imagePullPolicy: {{ include "agenta.services.pullPolicy" . }}
          {{- with $services.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            {{- if $newrelic.licenseKey }}
            - newrelic-admin
            - run-program
            {{- end }}
            - gunicorn
            - entrypoints.main:app
            - --bind
            - 0.0.0.0:{{ include "agenta.services.port" . }}
            - --worker-class
            - uvicorn.workers.UvicornWorker
            - --workers
            - {{ include "agenta.services.workers" . | quote }}
            - --max-requests
            - "10000"
            - --max-requests-jitter
            - "1000"
            - --timeout
            - "60"
            - --graceful-timeout
            - "60"
            - --log-level
            - info
            - --access-logfile
            - "-"
            - --error-logfile
            - "-"
          ports:
            - name: http
              containerPort: {{ include "agenta.services.port" . }}
              protocol: TCP
          env:
            {{- include "agenta.commonEnv" . | nindent 12 }}
            {{- include "agenta.servicesInternalEnv" . | nindent 12 }}
            - name: SCRIPT_NAME
              value: "/services"
            {{- include "agenta.agentRunner.servicesEnv" . | nindent 12 }}
            {{- /* The agenta SDK runs in this container and applies the transport rule for
                   gateway credentials; the runner re-applies it. Both need the same value. */}}
            {{- include "agenta.gatewayInsecureHttpEnv" . | nindent 12 }}
            {{- range $key, $val := $services.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            {{- /* extraEnv is a raw list of explicit Kubernetes env entries, so valueFrom works
                   and names here override earlier chart entries. envFrom pulls whole Secrets or
                   ConfigMaps, but Kubernetes uses those values only for names absent from env. */}}
            {{- with $services.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $services.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          {{- with $services.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- else }}
          {{- /* Default: hold the container open for 10 s after Kubernetes
                 sends the stop signal, so the load balancer finishes taking
                 this pod out of rotation before the process goes away. */}}
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          {{- end }}
          {{- with $services.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- $redisCaMount := include "agenta.redisDurableCaVolumeMount" . }}
          {{- if $redisCaMount }}
          volumeMounts:
            {{- $redisCaMount | nindent 12 }}
          {{- end }}
      {{- $redisCaVolume := include "agenta.redisDurableCaVolume" . }}
      {{- if $redisCaVolume }}
      volumes:
        {{- $redisCaVolume | nindent 8 }}
      {{- end }}
      {{- with $services.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $services.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $services.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $spread := include "agenta.topologySpreadConstraints" (dict "root" $ "component" "services" "key" "services" "replicas" (include "agenta.services.replicas" .)) }}
      {{- if $spread }}
      topologySpreadConstraints:
        {{- $spread | nindent 8 }}
      {{- end }}
{{- end }}
