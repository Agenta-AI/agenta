{{- $values := include "agenta.values" . | fromYaml -}}
{{- $redisVolatile := default dict $values.redisVolatile -}}
{{- if eq (include "agenta.redisVolatile.enabled" .) "true" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agenta.fullname" . }}-redis-volatile
  labels:
    {{- include "agenta.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis-volatile
spec:
  replicas: 1
  {{- with $redisVolatile.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "agenta.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis-volatile
  template:
    metadata:
      {{- /* A single-replica pod that holds state: the cluster autoscaler consolidating its node
             takes the whole component down. On GKE it evicted redis-volatile and supertokens
             mid-traffic and every agent turn was refused until the replacement pod was ready.
             The annotation makes the autoscaler skip that node for scale-down. It does not
             block an operator drain. On GKE Autopilot it also DELAYS automatic node upgrades
             for that node, and GKE may evict the pod anyway after about seven days, so it is a
             strong preference, not a guarantee. It is inert where no autoscaler runs. Set
             `$redisVolatile.safeToEvict: true` to opt out, or override the key through
             `$redisVolatile.podAnnotations`. */}}
      {{- $annotations := dict "cluster-autoscaler.kubernetes.io/safe-to-evict" (ternary "true" "false" (default false $redisVolatile.safeToEvict)) -}}
      {{- $annotations = merge (deepCopy (default dict $redisVolatile.podAnnotations)) $annotations }}
      annotations:
        {{- toYaml $annotations | nindent 8 }}
      labels:
        {{- include "agenta.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis-volatile
    spec:
      {{- include "agenta.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "agenta.serviceAccountName" . }}
      {{- if hasKey $redisVolatile "terminationGracePeriodSeconds" }}
      terminationGracePeriodSeconds: {{ $redisVolatile.terminationGracePeriodSeconds }}
      {{- end }}
      {{- with $redisVolatile.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: redis
          image: {{ include "agenta.redisVolatileImage" . }}
          imagePullPolicy: {{ include "agenta.redisVolatile.pullPolicy" . }}
          {{- with $redisVolatile.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - sh
            - -c
            - >-
              exec redis-server
              --appendonly no
              --save ""
              --maxmemory {{ include "agenta.redisVolatile.maxmemory" . | quote }}
              --maxmemory-policy {{ include "agenta.redisVolatile.maxmemoryPolicy" . }}
              --port {{ include "agenta.redisVolatile.port" . | quote }}
              {{- if $redisVolatile.password }}
              --requirepass "$REDIS_VOLATILE_PASSWORD"
              {{- end }}
          ports:
            - name: redis
              containerPort: {{ include "agenta.redisVolatile.port" . }}
              protocol: TCP
          {{- if $redisVolatile.password }}
          env:
            - name: REDIS_VOLATILE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "agenta.secretName" . }}
                  key: REDIS_VOLATILE_PASSWORD
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ include "agenta.secretName" . }}
                  key: REDIS_VOLATILE_PASSWORD
          {{- end }}
          {{- /* A startup probe, so a restart that has to replay the
                 append-only file is not killed by liveness while it works.
                 Liveness and readiness only begin once this passes. */}}
          startupProbe:
            exec:
              command: ["redis-cli", "-p", {{ include "agenta.redisVolatile.port" . | quote }}, "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["redis-cli", "-p", {{ include "agenta.redisVolatile.port" . | quote }}, "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command: ["redis-cli", "-p", {{ include "agenta.redisVolatile.port" . | quote }}, "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          {{- with $redisVolatile.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $redisVolatile.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with $redisVolatile.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $redisVolatile.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $redisVolatile.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
