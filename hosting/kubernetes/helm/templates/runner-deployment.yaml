{{- $runner := default dict .Values.agentRunner -}}
{{- $providers := default dict $runner.providers -}}
{{- $enabledProviders := default (list "local") $providers.enabled -}}
{{- $daytona := default dict $providers.daytona -}}
{{- $auth := default dict $runner.auth -}}
{{- if eq (include "agenta.agentRunner.enabled" .) "true" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agenta.agentRunner.serviceName" . }}
  labels:
    {{- include "agenta.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner
spec:
  replicas: {{ include "agenta.agentRunner.replicas" . }}
  {{- if $runner.strategy }}
  strategy:
    {{- toYaml $runner.strategy | nindent 4 }}
  {{- else if eq (include "agenta.agentRunner.localProviderEnabled" .) "true" }}
  {{- /* A local sandbox is a process inside the pod that started it, so the
         local provider runs one runner pod at a time: the old pod stops
         before the new one starts. */}}
  strategy:
    type: Recreate
  {{- else }}
  {{- /* Each turn is bound to its pod and Stop goes to that pod, so a new pod
         can take new turns while an old one finishes its own: start the new
         pod, wait until it is ready, then drain the old one. */}}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  {{- end }}
  selector:
    matchLabels:
      {{- include "agenta.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: runner
  template:
    metadata:
      labels:
        {{- include "agenta.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: runner
    spec:
      {{- include "agenta.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "agenta.serviceAccountName" . }}
      {{- /* Default 300 s: in-flight agent turns need room to finish. */}}
      terminationGracePeriodSeconds: {{ include "agenta.agentRunner.terminationGracePeriodSeconds" . }}
      {{- with $runner.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: runner
          image: {{ include "agenta.agentRunnerImage" . }}
          imagePullPolicy: {{ include "agenta.agentRunner.pullPolicy" . }}
          {{- /* FUSE for the durable session cwd: geesefs mounts the store prefix on-host for
                 local sandboxes, which needs SYS_ADMIN + /dev/fuse. Only granted when the store
                 is on AND agentRunner.fuse.enabled is true; an explicit runner.securityContext
                 (if set) overrides this default. Set agentRunner.fuse.enabled=false on a cluster
                 that rejects SYS_ADMIN or a hostPath, such as GKE Autopilot. */ -}}
          {{- if $runner.securityContext }}
          securityContext:
            {{- toYaml $runner.securityContext | nindent 12 }}
          {{- else if and (eq (include "agenta.store.enabled" .) "true") (eq (include "agenta.agentRunner.fuse.enabled" .) "true") }}
          securityContext:
            capabilities:
              add: ["SYS_ADMIN"]
          {{- end }}
          ports:
            - name: http
              containerPort: {{ include "agenta.agentRunner.port" . }}
              protocol: TCP
          env:
            {{- /* Narrow by design (runner-selfhosting-cleanup): a local harness process shares
                   this container, so anything here is readable from /proc. Only the runner's own
                   config and the API URL it needs to reach the platform — never the full
                   commonEnv (DB/auth/crypt/license/redis/store secrets). See
                   tests/test_runner_secret_absence.py. */}}
            - name: AGENTA_API_URL
              value: {{ include "agenta.apiUrlEffective" . | quote }}
            {{- $agentaVals := include "agenta.values" . | fromYaml -}}
            {{- if (default dict $agentaVals.agenta).apiInternalUrl }}
            - name: AGENTA_API_INTERNAL_URL
              value: {{ $agentaVals.agenta.apiInternalUrl | quote }}
            {{- end }}
            {{- /* The runner binds 127.0.0.1 by default, which is right for a laptop and wrong
                   in a pod: kubelet reaches the container over the pod IP, so every probe on
                   :<port>/health got connection refused and the pod never became ready.
                   Bind all interfaces. Override with agentRunner.host, or through the
                   agentRunner.env map below, which suppresses this entry the same way
                   PI_CODING_AGENT_DIR does. */}}
            {{- if not (hasKey (default dict $runner.env) "AGENTA_RUNNER_HOST") }}
            - name: AGENTA_RUNNER_HOST
              value: {{ include "agenta.agentRunner.host" . | quote }}
            {{- end }}
            - name: AGENTA_RUNNER_PORT
              value: {{ include "agenta.agentRunner.port" . | quote }}
            {{- /* The replica and strategy checks read agentRunner.providers to keep the local
                   provider on one pod, so agenta.validateRunnerChartOwnedEnv refuses an
                   agentRunner.env or extraEnv override of these two. */}}
            - name: AGENTA_RUNNER_ENABLED_SANDBOX_PROVIDERS
              value: {{ join "," $enabledProviders | quote }}
            - name: AGENTA_RUNNER_DEFAULT_SANDBOX_PROVIDER
              value: {{ default "local" $providers.default | quote }}
            {{- /* Each pod is its own replica: the API binds every turn to the pod that first
                   beats it and refuses any other pod for that turn, so two pods must never
                   share an id. The pod name is unique per pod and appears in the logs, so
                   agenta.validateRunnerChartOwnedEnv refuses an agentRunner.env or extraEnv
                   override. */}}
            - name: AGENTA_RUNNER_REPLICA_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- /* The address the API posts a Stop to for this pod's turns, and where Services
                   sends a session's follow-up messages. Kubernetes expands $(POD_IP) only from a
                   variable defined earlier in this list. The api and Services must be able to
                   reach pod IPs on the runner port: a NetworkPolicy that blocks that traffic
                   breaks Stop and follow-up routing. An IPv6 single-stack pod IP needs brackets in a
                   URL, so such a cluster sets AGENTA_RUNNER_REPLICA_ADDRESS in agentRunner.env. */}}
            {{- if not (hasKey (default dict $runner.env) "POD_IP") }}
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            {{- end }}
            {{- if not (hasKey (default dict $runner.env) "AGENTA_RUNNER_REPLICA_ADDRESS") }}
            - name: AGENTA_RUNNER_REPLICA_ADDRESS
              value: "http://$(POD_IP):{{ include "agenta.agentRunner.port" . }}"
            {{- end }}
            {{- /* On SIGTERM the runner refuses new turns, lets running ones finish for this long,
                   cancels the rest and deletes its sandboxes; all of it must end inside the grace
                   period. See agenta.agentRunner.shutdownWaitSeconds for the default.
                   agenta.validateRunnerChartOwnedEnv refuses an agentRunner.env or extraEnv
                   override, so agenta.validateRunnerShutdownWait sees the only value. */}}
            - name: AGENTA_RUNNER_SHUTDOWN_WAIT_SECONDS
              value: {{ include "agenta.agentRunner.shutdownWaitSeconds" . | quote }}
            {{- if not (hasKey (default dict $runner.env) "PI_CODING_AGENT_DIR") }}
            - name: PI_CODING_AGENT_DIR
              value: {{ default "/pi-agent" $runner.piAgentDir | quote }}
            {{- end }}
            {{- if $runner.logLevel }}
            - name: AGENTA_RUNNER_LOG_LEVEL
              value: {{ $runner.logLevel | quote }}
            {{- end }}
            {{- if and (hasKey $runner "liveFrames") (not (hasKey (default dict $runner.env) "AGENTA_RUNNER_LIVE_FRAMES")) }}
            - name: AGENTA_RUNNER_LIVE_FRAMES
              value: {{ $runner.liveFrames | quote }}
            {{- end }}
            {{- if $daytona.apiUrl }}
            - name: AGENTA_RUNNER_DAYTONA_API_URL
              value: {{ $daytona.apiUrl | quote }}
            {{- end }}
            {{- if $daytona.target }}
            - name: AGENTA_RUNNER_DAYTONA_TARGET
              value: {{ $daytona.target | quote }}
            {{- end }}
            {{- if $daytona.snapshot }}
            - name: AGENTA_RUNNER_DAYTONA_SNAPSHOT
              value: {{ $daytona.snapshot | quote }}
            {{- end }}
            {{- if $daytona.image }}
            - name: AGENTA_RUNNER_DAYTONA_IMAGE
              value: {{ $daytona.image | quote }}
            {{- end }}
            {{- if $daytona.autostopMinutes }}
            - name: AGENTA_RUNNER_DAYTONA_AUTOSTOP_MINUTES
              value: {{ $daytona.autostopMinutes | quote }}
            {{- end }}
            {{- if hasKey $daytona "sessionIdleTtlMs" }}
            - name: AGENTA_RUNNER_DAYTONA_SESSION_IDLE_TTL_MS
              value: {{ $daytona.sessionIdleTtlMs | quote }}
            {{- end }}
            {{- if hasKey $daytona "sessionMaxWarm" }}
            - name: AGENTA_RUNNER_DAYTONA_SESSION_MAX_WARM
              value: {{ $daytona.sessionMaxWarm | quote }}
            {{- end }}
            {{- if $daytona.autodeleteMinutes }}
            - name: AGENTA_RUNNER_DAYTONA_AUTODELETE_MINUTES
              value: {{ $daytona.autodeleteMinutes | quote }}
            {{- end }}
            {{- if $daytona.opaqueSecrets }}
            - name: AGENTA_RUNNER_DAYTONA_OPAQUE_SECRETS
              value: {{ $daytona.opaqueSecrets | quote }}
            {{- end }}
            {{- if $daytona.apiKeySecretRef }}
            - name: AGENTA_RUNNER_DAYTONA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $daytona.apiKeySecretRef.name | quote }}
                  key: {{ $daytona.apiKeySecretRef.key | quote }}
                  optional: true
            {{- end }}
            {{- /* Shared runner protocol credential (interface.md section 2): the runner verifies it
                   and Services sends the same value (see agentRunner.servicesEnv). REQUIRED — the
                   runner refuses to boot without it, so this is always rendered and never
                   `optional`. An explicit `auth.tokenSecretRef` overrides the platform Secret for
                   operators who keep the runner credential in their own vault. Note this mounts a
                   SINGLE key, not the whole Secret: the runner's env must stay narrow, because a
                   local harness shares its container and can read /proc (tests/test_runner_secret_absence.py).
                   The fallback goes through `agenta.secretName`, not `agenta.fullname`, so a
                   `secrets.existingSecret` install reads the operator's own Secret. The chart does
                   not create its own Secret in that case, so a hardcoded name would never resolve
                   and the runner would crash-loop (tests/test_existing_secret.py). */}}
            - name: AGENTA_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  {{- if $auth.tokenSecretRef }}
                  name: {{ $auth.tokenSecretRef.name | quote }}
                  key: {{ $auth.tokenSecretRef.key | quote }}
                  {{- else }}
                  name: {{ include "agenta.secretName" . | quote }}
                  key: AGENTA_RUNNER_TOKEN
                  {{- end }}
            {{- /* One non-secret config value, named explicitly rather than pulled in with a
                   block, so the narrow-env rule above still holds. The runner is the leg that
                   refuses a gateway-routed run: it re-validates the transport rule the SDK
                   applied, so a value set for services but not here admits the run and then
                   strands it inside the sandbox. */}}
            {{- include "agenta.gatewayInsecureHttpEnv" . | nindent 12 }}
            {{- range $key, $val := $runner.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            {{- /* extraEnv and envFrom widen the runner's environment, which is narrow ON
                   PURPOSE: a local harness process shares this container and can read /proc.
                   envFrom in particular pulls a whole Secret and defeats
                   tests/test_runner_secret_absence.py, which can only see named entries. Add one
                   key at a time with extraEnv and keep platform credentials out. */}}
            {{- with $runner.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $runner.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          {{- with $runner.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- else }}
          {{- /* Default: hold the container open for 10 s after Kubernetes
                 sends the stop signal, so the load balancer finishes taking
                 this pod out of rotation before the process goes away. */}}
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          {{- end }}
          {{- with $runner.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if and (eq (include "agenta.store.enabled" .) "true") (eq (include "agenta.agentRunner.fuse.enabled" .) "true") }}
          volumeMounts:
            - name: fuse
              mountPath: /dev/fuse
          {{- end }}
      {{- if and (eq (include "agenta.store.enabled" .) "true") (eq (include "agenta.agentRunner.fuse.enabled" .) "true") }}
      volumes:
        - name: fuse
          hostPath:
            path: /dev/fuse
            type: CharDevice
      {{- end }}
      {{- with $runner.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $runner.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $runner.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $spread := include "agenta.topologySpreadConstraints" (dict "root" $ "component" "runner" "key" "agentRunner" "replicas" (include "agenta.agentRunner.replicas" .)) }}
      {{- if $spread }}
      topologySpreadConstraints:
        {{- $spread | nindent 8 }}
      {{- end }}
{{- end }}
