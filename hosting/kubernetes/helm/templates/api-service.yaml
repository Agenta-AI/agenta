{{- if eq (include "agenta.api.enabled" .) "true" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agenta.fullname" . }}-api
  labels:
    {{- include "agenta.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- /* Annotation hook for the ingress controller. GKE reads
         cloud.google.com/backend-config and cloud.google.com/neg here. */}}
  {{- with (default dict (default dict .Values.api).service).annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - port: {{ include "agenta.api.port" . }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "agenta.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
{{- end }}
