name: agenta-oss-dev

services:
    .api:
        # === IMAGE ================================================ #
        image: agenta-oss-dev-api:latest
        build:
            context: ../../..
            dockerfile: api/oss/docker/Dockerfile.dev
        # === EXECUTION ============================================ #
        command: ["true"]

    .web:
        # === ACTIVATION =========================================== #
        profiles:
            - with-web
        # === IMAGE ================================================ #
        image: agenta-oss-dev-web:latest
        build:
            context: ../../../web
            dockerfile: oss/docker/Dockerfile.dev
        # === EXECUTION ============================================ #
        command: ["true"]

    .services:
        # === IMAGE ================================================ #
        image: agenta-oss-dev-services:latest
        build:
            context: ../../..
            dockerfile: services/oss/docker/Dockerfile.dev
        # === EXECUTION ============================================ #
        command: ["true"]

    .runner:
        # === IMAGE ================================================ #
        image: agenta-oss-dev-runner:latest
        build:
            context: ../../../services/runner
            dockerfile: docker/Dockerfile.dev
        # === EXECUTION ============================================ #
        command: ["true"]

    web:
        # === ACTIVATION =========================================== #
        profiles:
            - with-web
        # === IMAGE ================================================ #
        image: agenta-oss-dev-web:latest
        # === EXECUTION ============================================ #
        # Turbopack's dev middleware sandbox only exposes .env-file vars (not the
        # container's process env), so mirror the gate flag into an env file the
        # app loads. Prod standalone reads process.env at request time — dev-only.
        command: sh -c 'echo "AGENTA_MOBILE_GATE=$${AGENTA_MOBILE_GATE:-false}" > /app/oss/.env.development.local && pnpm dev-oss'
        # === STORAGE ============================================== #
        volumes:
            #
            #
            - ../../../web/oss/src:/app/oss/src
            - ../../../web/oss/public:/app/oss/public
            - ../../../web/oss/scripts:/app/oss/scripts
            - ../../../web/packages:/app/packages
            - nextjs-oss-cache:/app/oss/.next/cache
            - turbo-oss-cache:/app/.turbo
        # === CONFIGURATION ======================================== #
        env_file:
            - ${ENV_FILE:-./.env.oss.dev}
        environment:
            DOCKER_NETWORK_MODE: ${DOCKER_NETWORK_MODE:-bridge}
            WATCHPACK_POLLING: "true"
            AGENTA_MOBILE_GATE: ${AGENTA_MOBILE_GATE:-false}
        # === NETWORK ============================================== #
        networks:
            - agenta-network
        # === LABELS =============================================== #
        labels:
            - "traefik.http.routers.agenta-web.rule=PathPrefix(`/`)"
            - "traefik.http.routers.agenta-web.entrypoints=web"
            - "traefik.http.services.agenta-web.loadbalancer.server.port=3000"
        # === LIFECYCLE ============================================ #
        restart: always

    web-mobile:
        # === ACTIVATION =========================================== #
        profiles:
            - with-web-mobile
        # === IMAGE ================================================ #
        image: agenta-oss-dev-web:latest
        # === EXECUTION ============================================ #
        # Same dev-sandbox env mirroring as the web service (see comment there).
        command: sh -c 'printf "AGENTA_MOBILE_GATE=%s\nAGENTA_MOBILE_REVERSE_GATE=%s\n" "$${AGENTA_MOBILE_GATE:-false}" "$${AGENTA_MOBILE_REVERSE_GATE:-true}" > /app/mobile/.env.development.local && pnpm dev-mobile'
        # === STORAGE ============================================== #
        volumes:
            - ../../../web/packages:/app/packages
            - ../../../web/mobile/src:/app/mobile/src
            - ../../../web/mobile/public:/app/mobile/public
            - nextjs-mobile-cache:/app/mobile/.next/cache
            - turbo-mobile-cache:/app/.turbo
        # === CONFIGURATION ======================================== #
        env_file:
            - ${ENV_FILE:-./.env.oss.dev}
        environment:
            DOCKER_NETWORK_MODE: ${DOCKER_NETWORK_MODE:-bridge}
            WATCHPACK_POLLING: "true"
            AGENTA_MOBILE_GATE: ${AGENTA_MOBILE_GATE:-false}
            AGENTA_MOBILE_REVERSE_GATE: ${AGENTA_MOBILE_REVERSE_GATE:-true}
        # === NETWORK ============================================== #
        networks:
            - agenta-network
        # === LABELS =============================================== #
        # Path(`/m`) || PathPrefix(`/m/`), not PathPrefix(`/m`): the bare prefix is
        # greedy and would also swallow /mfoo from the web catch-all PathPrefix(`/`).
        # Still auto-wins over that catch-all by rule length; no stripprefix — the app
        # is built with basePath /m.
        labels:
            - "traefik.http.routers.agenta-web-mobile.rule=Path(`/m`) || PathPrefix(`/m/`)"
            - "traefik.http.routers.agenta-web-mobile.entrypoints=web"
            - "traefik.http.services.agenta-web-mobile.loadbalancer.server.port=3000"
        # === LIFECYCLE ============================================ #
        restart: always

    api:
        # === IMAGE ================================================ #
        image: agenta-oss-dev-api:latest
        # === EXECUTION ============================================ #
        command:
            [
                "uvicorn",
                "entrypoints.routers:app",
                "--host",
                "0.0.0.0",
                "--port",
                "8000",
                "--reload",
                "--reload-dir",
                "/app/oss/src",
                "--reload-dir",
                "/app/oss/databases",
                "--reload-dir",
                "/app/entrypoints",
                "--reload-dir",
                "/sdks/python/agenta",
                "--reload-dir",
                "/clients/python/agenta_client",
                "--reload-exclude",
                "*.pyc",
                "--reload-exclude",
                "__pycache__",
                # Without a graceful-shutdown bound, --reload waits forever for open SSE
                # streams (/sessions/watch) and the api deadlocks on every code change.
                "--timeout-graceful-shutdown",
                "5",
                "--root-path",
                "/api",
                "--loop",
                "uvloop",
                "--http",
                "httptools",
            ]
        # === STORAGE ============================================== #
        volumes:
            #
            - ../../../api/oss:/app/oss
            - ../../../api/entrypoints:/app/entrypoints
            - ../../../sdks/python:/sdks/python
            - ../../../clients/python:/clients/python
        # === CONFIGURATION ======================================== #
        env_file:
            - ${ENV_FILE:-./.env.oss.dev}
        environment:
            DOCKER_NETWORK_MODE: ${DOCKER_NETWORK_MODE:-bridge}
            AGENTA_GATEWAYS_MOCKS_ENABLED: "true"
            AGENTA_GATEWAYS_MOCKS_UPSTREAM_TOKEN: ${AGENTA_GATEWAYS_MOCKS_UPSTREAM_TOKEN:-agenta-gateway-mock-token}
            # kill's direct runner hop (W7.3, sandbox teardown) — same compose-network
            # address + shared token as the `services` container's runner_url().
            AGENTA_RUNNER_INTERNAL_URL: ${AGENTA_RUNNER_INTERNAL_URL:-http://runner:8765}
            AGENTA_RUNNER_TOKEN: ${AGENTA_RUNNER_TOKEN:?AGENTA_RUNNER_TOKEN is required}
            # Unset leaves the code default (3600s) in place.
            AGENTA_MOUNTS_CREDENTIALS_TTL_SECONDS: ${AGENTA_MOUNTS_CREDENTIALS_TTL_SECONDS:-}
        # === NETWORK ============================================== #
        networks:
            - agenta-network
        extra_hosts:
            - "host.docker.internal:host-gateway"
        # === ORCHESTRATION ======================================== #
        depends_on:
            postgres:
                condition: service_healthy
            alembic:
                condition: service_completed_successfully
            supertokens:
                condition: service_healthy
            redis-volatile:
                condition: service_healthy
            redis-durable:
                condition: service_healthy
            seaweedfs:
                condition: service_healthy
        # === LABELS =============================================== #
        labels:
            - "traefik.http.routers.api.rule=PathPrefix(`/api/`)"
            - "traefik.http.routers.api.entrypoints=web"
            - "traefik.http.middlewares.api-strip.stripprefix.prefixes=/api"
            - "traefik.http.middlewares.api-strip.stripprefix.forceslash=true"
            - "traefik.http.routers.api.middlewares=api-strip"
            - "traefik.http.services.api.loadbalancer.server.port=8000"
            - "traefik.http.routers.api.service=api"
        # === LIFECYCLE ============================================ #
        restart: always

    worker-streams:
        # === IMAGE ================================================ #
        image: agenta-oss-dev-api:latest
        # === EXECUTION ============================================ #
        init: true
        command: >
            watchmedo auto-restart --directory=/app/ee/src --directory=/app/ee/databases --directory=/app/oss/src
            --directory=/app/oss/databases --directory=/app/entrypoints --directory=/sdks/python/agenta
            --directory=/clients/python/agenta_client --pattern=*.py --recursive --ignore-patterns=*/tests/*
            --signal SIGTERM --kill-after 5 --
            python -m entrypoints.worker_streams
        # === STORAGE ============================================== #
        volumes:
            - ../../../api/ee:/app/ee
            - ../../../api/oss:/app/oss
            - ../../../api/entrypoints:/app/entrypoints
            - ../../../sdks/python:/sdks/python
            - ../../../clients/python:/clients/python
        # === CONFIGURATION ======================================== #
        env_file:
            - ${ENV_FILE:-./.env.oss.dev}
        environment:
            DOCKER_NETWORK_MODE: ${DOCKER_NETWORK_MODE:-bridge}
            # empty ⇒ all stream loops; see docs/designs/workers-sprawl/specs.md
            AGENTA_WORKER_STREAMS: ""
        # === NETWORK ============================================== #
        networks:
            - agenta-network
        extra_hosts:
            - "host.docker.internal:host-gateway"
        # === ORCHESTRATION ======================================== #
        depends_on:
            postgres:
                condition: service_healthy
            alembic:
                condition: service_completed_successfully
            redis-volatile:
                condition: service_healthy
            redis-durable:
                condition: service_healthy
        # === LIFECYCLE ============================================ #
        restart: always
        healthcheck:
            test: ["CMD", "python", "-c", "import pathlib,sys; cmd=pathlib.Path('/proc/1/cmdline').read_bytes().decode('utf-8','ignore'); sys.exit(0 if 'entrypoints.worker_streams' in cmd else 1)"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 20s

    worker-queues:
        # === IMAGE ================================================ #
        image: agenta-oss-dev-api:latest
        # === EXECUTION ============================================ #
        init: true
        command: >
            watchmedo auto-restart --directory=/app/ee/src --directory=/app/ee/databases --directory=/app/oss/src
            --directory=/app/oss/databases --directory=/app/entrypoints --directory=/sdks/python/agenta
            --directory=/clients/python/agenta_client --pattern=*.py --recursive --ignore-patterns=*/tests/*
            --signal SIGTERM --kill-after 5 --
            python -m entrypoints.worker_queues
        # === STORAGE ============================================== #
        volumes:
            - ../../../api/ee:/app/ee
            - ../../../api/oss:/app/oss
            - ../../../api/entrypoints:/app/entrypoints
            - ../../../sdks/python:/sdks/python
            - ../../../clients/python:/clients/python
        # === CONFIGURATION ======================================== #
        env_file:
            - ${ENV_FILE:-./.env.oss.dev}
        environment:
            DOCKER_NETWORK_MODE: ${DOCKER_NETWORK_MODE:-bridge}
            # empty ⇒ all queue loops; see docs/designs/workers-sprawl/specs.md
            AGENTA_WORKER_QUEUES: ""
        # === NETWORK ============================================== #
        networks:
            - agenta-network
        extra_hosts:
            - "host.docker.internal:host-gateway"
        # === ORCHESTRATION ======================================== #
        depends_on:
            postgres:
                condition: service_healthy
            alembic:
                condition: service_completed_successfully
            redis-volatile:
                condition: service_healthy
            redis-durable:
                condition: service_healthy
        # === LIFECYCLE ============================================ #
        restart: always
        healthcheck:
            test: ["CMD", "python", "-c", "import pathlib,sys; cmd=pathlib.Path('/proc/1/cmdline').read_bytes().decode('utf-8','ignore'); sys.exit(0 if 'entrypoints.worker_queues' in cmd else 1)"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 20s

    cron:
        # === IMAGE ================================================ #
        image: agenta-oss-dev-api:latest
        # === EXECUTION ============================================ #
        init: true
        command: supercronic /app/crontab
        # === STORAGE ============================================== #
        volumes:
            #
            - ../../../api/oss/src/crons/queries.sh:/queries.sh
            - ../../../api/oss/src/crons/triggers.sh:/triggers.sh
        # === CONFIGURATION ======================================== #
        env_file:
            - ${ENV_FILE:-./.env.oss.dev}
        environment:
            DOCKER_NETWORK_MODE: ${DOCKER_NETWORK_MODE:-bridge}
        # === NETWORK ============================================== #
        networks:
            - agenta-network
        extra_hosts:
            - "host.docker.internal:host-gateway"
        # === ORCHESTRATION ======================================== #
        depends_on:
            - postgres
            - api
        # === LIFECYCLE ============================================ #
        restart: always

    alembic:
        # === IMAGE ================================================ #
        image: agenta-oss-dev-api:latest
        # === EXECUTION ============================================ #
        command: sh -c "python -m oss.databases.postgres.migrations.runner"
        # === STORAGE ============================================== #
        volumes:
            #
            - ../../../api/oss:/app/oss
            - ../../../api/entrypoints:/app/entrypoints
            - ../../../sdks/python:/sdks/python
            - ../../../clients/python:/clients/python
        # === CONFIGURATION ======================================== #
        env_file:
            - ${ENV_FILE:-./.env.oss.dev}
        environment:
            DOCKER_NETWORK_MODE: ${DOCKER_NETWORK_MODE:-bridge}
        # === NETWORK ============================================== #
        networks:
            - agenta-network
        # === ORCHESTRATION ======================================== #
        depends_on:
            postgres:
                condition: service_healthy

    services:
        # === IMAGE ================================================ #
        image: agenta-oss-dev-services:latest
        # === EXECUTION ============================================ #
        command:
            [
                "uvicorn",
                "entrypoints.main:app",
                "--host",
                "0.0.0.0",
                "--port",
                "8080",
                "--reload",
                "--reload-dir",
                "/app/oss/src",
                "--reload-dir",
                "/app/entrypoints",
                "--reload-dir",
                "/sdks/python/agenta",
                "--reload-dir",
                "/clients/python/agenta_client",
                "--reload-exclude",
                "*.pyc",
                "--reload-exclude",
                "__pycache__",
                "--root-path",
                "/services",
                "--loop",
                "uvloop",
                "--http",
                "httptools",
            ]
        # === STORAGE ============================================== #
        volumes:
            - ../../../services:/app
            - ../../../sdks/python:/sdks/python
            - ../../../clients/python:/clients/python
        # === CONFIGURATION ======================================== #
        env_file:
            - ${ENV_FILE:-./.env.oss.dev}
        environment:
            DOCKER_NETWORK_MODE: ${DOCKER_NETWORK_MODE:-bridge}
            AGENTA_RUNNER_INTERNAL_URL: ${AGENTA_RUNNER_INTERNAL_URL:-http://runner:8765}
            AGENTA_RUNNER_TOKEN: ${AGENTA_RUNNER_TOKEN:?AGENTA_RUNNER_TOKEN is required}
        # === NETWORK ============================================== #
        networks:
            - agenta-network
        extra_hosts:
            - "host.docker.internal:host-gateway"
        # === ORCHESTRATION ======================================== #
        depends_on:
            runner:
                condition: service_healthy
        # === LABELS =============================================== #
        labels:
            - "traefik.http.routers.services.rule=PathPrefix(`/services/`)"
            - "traefik.http.routers.services.entrypoints=web"
            - "traefik.http.middlewares.services-strip.stripprefix.prefixes=/services"
            - "traefik.http.middlewares.services-strip.stripprefix.forceslash=true"
            - "traefik.http.routers.services.middlewares=services-strip"
            - "traefik.http.services.services.loadbalancer.server.port=8080"
            - "traefik.http.routers.services.service=services"
        # === LIFECYCLE ============================================ #
        restart: always

    runner:
        # === IMAGE ================================================ #
        image: agenta-oss-dev-runner:latest
        # === EXECUTION ============================================ #
        init: true
        # The Pi login is bind-mounted read-write at /pi-agent and the harness runs directly out
        # of it, so a refreshed OAuth token persists to the host login instead of dying with the
        # container.
        command: >
            sh -c "node scripts/build-extension.mjs &&
            exec node_modules/.bin/tsx watch src/server.ts"
        # === CONFIGURATION ======================================== #
        # Deliberately no env_file: harness processes must not inherit the full stack
        # secret set. Tools run server-side through /tools/call; the runner only needs
        # its own port plus optional runner-scoped provider credentials.
        environment:
            AGENTA_RUNNER_PORT: "8765"
            # Bind on all interfaces: the co-located Python `services` container reaches the
            # sidecar over the compose network at `runner:8765`, so the trust-model
            # default of `127.0.0.1` (same-host only) is unreachable cross-container.
            AGENTA_RUNNER_HOST: ${AGENTA_RUNNER_HOST:-0.0.0.0}
            PI_CODING_AGENT_DIR: /pi-agent
            # API as reached FROM this container: the compose service name over the network
            # (http://api:8000, as the workers use), NOT the public http://localhost/api
            # which does not resolve inside a container. Used by the OTLP tracing-export
            # fallback AND the session heartbeat/record-persist calls.
            AGENTA_API_INTERNAL_URL: ${AGENTA_API_INTERNAL_URL:-http://api:8000}
            AGENTA_API_KEY: ${AGENTA_API_KEY:-}
            AGENTA_RUNNER_TOKEN: ${AGENTA_RUNNER_TOKEN:?AGENTA_RUNNER_TOKEN is required}
            AGENTA_RUNNER_ENABLED_SANDBOX_PROVIDERS: ${AGENTA_RUNNER_ENABLED_SANDBOX_PROVIDERS:-local}
            AGENTA_RUNNER_DEFAULT_SANDBOX_PROVIDER: ${AGENTA_RUNNER_DEFAULT_SANDBOX_PROVIDER:-local}
            # Worst-case turn duration. Keep AGENTA_MOUNTS_CREDENTIALS_TTL_SECONDS (API) above it
            # plus 60s of skew, or every dispatch rebuilds the environment cold.
            AGENTA_RUNNER_RUN_TOTAL_TIMEOUT_MS: ${AGENTA_RUNNER_RUN_TOTAL_TIMEOUT_MS:-}
            AGENTA_RUNNER_DAYTONA_API_KEY: ${AGENTA_RUNNER_DAYTONA_API_KEY:-}
            AGENTA_RUNNER_DAYTONA_API_URL: ${AGENTA_RUNNER_DAYTONA_API_URL:-}
            AGENTA_RUNNER_DAYTONA_TARGET: ${AGENTA_RUNNER_DAYTONA_TARGET:-}
            AGENTA_RUNNER_DAYTONA_SNAPSHOT: ${AGENTA_RUNNER_DAYTONA_SNAPSHOT:-}
            AGENTA_RUNNER_DAYTONA_IMAGE: ${AGENTA_RUNNER_DAYTONA_IMAGE:-}
            AGENTA_RUNNER_DAYTONA_AUTOSTOP_MINUTES: ${AGENTA_RUNNER_DAYTONA_AUTOSTOP_MINUTES:-}
            AGENTA_RUNNER_DAYTONA_SESSION_IDLE_TTL_MS: ${AGENTA_RUNNER_DAYTONA_SESSION_IDLE_TTL_MS:-}
            AGENTA_RUNNER_DAYTONA_SESSION_MAX_WARM: ${AGENTA_RUNNER_DAYTONA_SESSION_MAX_WARM:-}
            AGENTA_RUNNER_DAYTONA_AUTODELETE_MINUTES: ${AGENTA_RUNNER_DAYTONA_AUTODELETE_MINUTES:-}
            AGENTA_RUNNER_DAYTONA_OPAQUE_SECRETS: ${AGENTA_RUNNER_DAYTONA_OPAQUE_SECRETS:-}
            # This service has no env_file (see above), so the session flags must be listed
            # here or they can never be set. Both default ON: absent or empty means on, and
            # only the literal "false" disables. Disable AGENTA_SESSIONS_RECONSTRUCT together
            # with the web NEXT_PUBLIC_SESSIONS_LAST_MESSAGE_ONLY, or a turn that carries
            # only its last message loses the conversation.
            AGENTA_SESSIONS_RECONSTRUCT: ${AGENTA_SESSIONS_RECONSTRUCT:-}
            AGENTA_RECORDS_DURABLE: ${AGENTA_RECORDS_DURABLE:-}
        # === STORAGE ============================================== #
        volumes:
            - ../../../services/runner/src:/app/src
            - ../../../services/runner/skills:/app/skills
            # Read-write on purpose: the harness refreshes its own OAuth token here and the new
            # token must persist back to the host login (a copy would discard it).
            - ${HOME}/.pi/agent:/pi-agent:rw
        # === NETWORK ============================================== #
        networks:
            - agenta-network
        # === RUNTIME ============================================== #
        # FUSE for the durable session cwd (geesefs mounts the mount prefix on-host for local
        # sandboxes). Needs the fuse device + SYS_ADMIN; apparmor unconfined so mount(2) is allowed.
        cap_add:
            - SYS_ADMIN
        devices:
            - /dev/fuse
        security_opt:
            - apparmor:unconfined
        # === LIFECYCLE ============================================ #
        restart: always
        healthcheck:
            test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8765/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 20s

    postgres:
        # === IMAGE ================================================ #
        image: postgres:17
        # === STORAGE ============================================== #
        volumes:
            - postgres-data:/var/lib/postgresql/data/
            - ../../../api/oss/databases/postgres/init-db-oss.sql:/docker-entrypoint-initdb.d/init-db.sql
        # === CONFIGURATION ======================================== #
        env_file:
            - ${ENV_FILE:-./.env.oss.dev}
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-username}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
        # === NETWORK ============================================== #
        networks:
            - agenta-network
        ports:
            - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
        # === LIFECYCLE ============================================ #
        restart: always
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U username -d agenta_oss_core"]
            interval: 10s
            timeout: 5s
            retries: 5

    redis-volatile:
        # === IMAGE ================================================ #
        image: redis:8
        # === EXECUTION ============================================ #
        command: >
            redis-server
            --appendonly no
            --save ""
            --maxmemory 512mb
            --maxmemory-policy volatile-lru
            --port 6379
        # === STORAGE ============================================== #
        volumes:
            - redis-volatile-data:/data
        # === NETWORK ============================================== #
        networks:
            - agenta-network
        # === LIFECYCLE ============================================ #
        restart: always
        healthcheck:
            test: ["CMD", "redis-cli", "-p", "6379", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 5s

    redis-durable:
        # === IMAGE ================================================ #
        image: redis:8
        # === EXECUTION ============================================ #
        command: >
            redis-server
            --appendonly yes
            --appendfsync no
            --aof-load-corrupt-tail-max-size 1048576
            --save ""
            --maxmemory 512mb
            --maxmemory-policy noeviction
            --port 6381
        # === STORAGE ============================================== #
        volumes:
            - redis-durable-data:/data
        # === NETWORK ============================================== #
        networks:
            - agenta-network
        # === LIFECYCLE ============================================ #
        restart: always
        healthcheck:
            test: ["CMD", "redis-cli", "-p", "6381", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 5s

    seaweedfs:
        # === IMAGE ================================================ #
        # Pinned (not :latest) so the IAM/STS subsystem stays on a known-good build — it has
        # regressed across releases (e.g. 4.13). 4.37 verified working with the config below.
        image: chrislusf/seaweedfs:4.37
        # === EXECUTION ============================================ #
        # ONLY FOR SEAWEEDFS (the bundled dev store). Real S3/R2/MinIO ship their own STS/IAM
        # and ignore all of this. Two configs, both generated from env (no committed files):
        #  - s3.json: the master identity only (admin; the API holds these creds, never the runner).
        #  - iam.json: the ADVANCED IAM config — the only path SeaweedFS authorizes STS credentials.
        #    An OIDC provider points at the API's self-served JWKS; the API mints a short-lived
        #    RS256 web-identity token and calls AssumeRoleWithWebIdentity to assume `agenta-store`,
        #    whose policy grants the whole bucket; the API's per-request inline session policy
        #    narrows each credential to one mount prefix (effective = role ∩ session).
        #    GetFederationToken is NOT modelled by SeaweedFS IAM and yields actionless (denied) tokens.
        entrypoint:
            - sh
            - -c
            - |
              cat > /etc/seaweedfs/s3.json <<EOF
              {"identities":[{"name":"agenta","credentials":[{"accessKey":"$${AGENTA_STORE_ACCESS_KEY}","secretKey":"$${AGENTA_STORE_SECRET_KEY}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
              EOF
              cat > /etc/seaweedfs/iam.json <<EOF
              {"sts":{"tokenDuration":"1h","maxSessionLength":"12h","issuer":"seaweedfs-sts","signingKey":"$${AGENTA_STORE_SIGNING_KEY}"},"providers":[{"name":"agenta","type":"oidc","enabled":true,"config":{"issuer":"$${AGENTA_STORE_JWT_ISSUER}","clientId":"agenta-store","jwksUri":"$${AGENTA_STORE_JWT_ISSUER}/.well-known/jwks.json"}}],"policies":[{"name":"store-rw","document":{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:*"],"Resource":["arn:aws:s3:::$${AGENTA_STORE_BUCKET}","arn:aws:s3:::$${AGENTA_STORE_BUCKET}/*"]}]}}],"roles":[{"roleName":"agenta-store","roleArn":"arn:aws:iam::role/agenta-store","attachedPolicies":["store-rw"],"trustPolicy":{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Federated":"agenta"},"Action":["sts:AssumeRoleWithWebIdentity"]}]}}]}
              EOF
              exec weed server -dir=/data -ip=seaweedfs -volume.max=64 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -s3.iam.config=/etc/seaweedfs/iam.json
        # === CONFIGURATION ======================================== #
        env_file:
            - ${ENV_FILE:-./.env.oss.dev}
        environment:
            # The entrypoint bakes these into s3.json/iam.json via raw shell expansion, so unlike
            # the API (which reads code defaults from env.py) they must be present in this service's
            # env. Defaults live here for the bundled store the same way supertokens carries its own
            # connection URI — a service configuring itself. Override via the env file to use S3/R2.
            # Keys come from the env file — secrets never get a baked-in default.
            AGENTA_STORE_ACCESS_KEY: ${AGENTA_STORE_ACCESS_KEY}
            AGENTA_STORE_SECRET_KEY: ${AGENTA_STORE_SECRET_KEY}
            # Non-secret store config: defaults live here for the bundled store (override via env).
            AGENTA_STORE_BUCKET: ${AGENTA_STORE_BUCKET:-agenta-store}
            AGENTA_STORE_SIGNING_KEY: ${AGENTA_STORE_SIGNING_KEY:-dGhpcy1pcy1hLXNpZ25pbmcta2V5LWZvci1tb3VudHM=}
            AGENTA_STORE_JWT_ISSUER: ${AGENTA_STORE_JWT_ISSUER:-http://api:8000}
        # === STORAGE ============================================== #
        volumes:
            - seaweed-data:/data
        # === NETWORK ============================================== #
        networks:
            - agenta-network
        # Loopback-only: host-run tests use this published S3 endpoint, while
        # containers continue using the in-network `seaweedfs:8333` address.
        ports:
            - "127.0.0.1:${AGENTA_STORE_PORT:-8333}:8333"
        # === LIFECYCLE ============================================ #
        restart: always
        healthcheck:
            test: ["CMD-SHELL", "curl -sf http://localhost:9333/cluster/healthz >/dev/null || exit 1"]
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 5s

    ngrok-mounts:
        # === ACTIVATION =========================================== #
        # Only for REMOTE sandboxes (Daytona/E2B): geesefs runs inside the cloud sandbox and
        # cannot reach `seaweedfs:8333` on the compose network, so this tunnels the store to a
        # public URL the runner discovers via the ngrok agent API (:4040/api/tunnels). Local
        # sandboxes never tunnel. Shares `with-tunnel` with composio (on by default, off with
        # --no-tunnel); with no NGROK_AUTHTOKEN it exits 0 and the remote mount is skipped,
        # which the runner treats as non-fatal.
        profiles:
            - with-tunnel
        # === IMAGE ================================================ #
        image: ngrok/ngrok:latest
        # === EXECUTION ============================================ #
        # Tunnel the SeaweedFS S3 port. Without a token ngrok would exit non-zero and, under
        # `restart: on-failure`, loop; exit 0 instead so an unconfigured deploy stays quiet.
        # The agent API defaults to 127.0.0.1:4040 (unreachable from the runner container), so
        # bind it on all interfaces: that API is how the runner discovers the public URL.
        entrypoint: ["/bin/sh", "-c"]
        command:
            - |
              if [ -z "$${NGROK_AUTHTOKEN}" ]; then
                echo "ngrok-mounts: NGROK_AUTHTOKEN unset; no tunnel (remote sandbox mounts disabled)."
                exit 0
              fi
              printf 'version: 3\nagent:\n  web_addr: 0.0.0.0:4040\n' > /tmp/ngrok.yml
              exec /bin/ngrok http seaweedfs:8333 --log stdout --config /tmp/ngrok.yml
        # === CONFIGURATION ======================================== #
        environment:
            NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
        # === NETWORK ============================================== #
        networks:
            - agenta-network
        # The agent runner reads the public URL from this API (host:4040 inside the network).
        # ports:
        #     - "4040:4040"
        # === LIFECYCLE ============================================ #
        # Not `always`: that would restart the intentional exit-0 above into a loop.
        restart: on-failure
        depends_on:
            seaweedfs:
                condition: service_healthy

    ngrok-ingress:
        # === ACTIVATION =========================================== #
        # A SECOND tunnel, beside the store's, publishing THIS deployment's ingress on a public
        # HTTPS address. It exists for the cases where something outside has to reach us: a
        # platform posting a webhook, or an authorization server fetching a document we serve.
        #
        # It forwards to traefik, so every inbound route arrives on its normal path -- `/api/...`
        # is already routed there, in the self-host compose files, and in production. So no
        # integration needs a tunnel of its own; one endpoint serves channels, the model and MCP
        # gateways, and anything added later.
        #
        # A browser redirect needs none of this: the user is already looking at this deployment,
        # so the address that got them there is one their browser reaches.
        #
        # Separate from the `ngrok-mounts` service on purpose. That one publishes the object store and
        # the runner finds it at `ngrok-mounts:4040`; keeping them apart means neither can be handed the
        # other's URL. Costs two agent sessions -- if the plan allows only one, run a single agent
        # with two named endpoints instead: the runner matches a tunnel by the upstream it
        # forwards to, so that arrangement is safe too.
        profiles:
            - with-tunnel
        # === IMAGE ================================================ #
        image: ngrok/ngrok:latest
        # === EXECUTION ============================================ #
        # Same shape as the store tunnel: without a token ngrok would exit non-zero and, under
        # `restart: on-failure`, loop; exit 0 instead so an unconfigured deploy stays quiet.
        # NGROK_DOMAIN_INGRESS pins a reserved domain, which is what keeps an address we hand to a
        # provider valid across restarts -- a rotating one invalidates every registration.
        entrypoint: ["/bin/sh", "-c"]
        command:
            - |
              if [ -z "$${NGROK_AUTHTOKEN}" ]; then
                echo "ngrok-ingress: NGROK_AUTHTOKEN unset; no tunnel (ingress not published)."
                exit 0
              fi
              DOMAIN_ARG=""
              if [ -n "$${NGROK_DOMAIN_INGRESS}" ]; then
                DOMAIN_ARG="--domain=$${NGROK_DOMAIN_INGRESS}"
              fi
              printf 'version: 3\nagent:\n  web_addr: 0.0.0.0:4040\n' > /tmp/ngrok.yml
              exec /bin/ngrok http traefik:80 $${DOMAIN_ARG} --log stdout --config /tmp/ngrok.yml
        # === CONFIGURATION ======================================== #
        environment:
            NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
            NGROK_DOMAIN_INGRESS: ${NGROK_DOMAIN_INGRESS:-}
        # === NETWORK ============================================== #
        networks:
            - agenta-network
        # Nothing reads this agent's API today; the public URL is for a human to paste into a
        # provider's configuration. Uncomment to inspect it from the host.
        # ports:
        #     - "4041:4040"
        # === LIFECYCLE ============================================ #
        # Not `always`: that would restart the intentional exit-0 above into a loop.
        restart: on-failure
        depends_on:
            traefik:
                condition: service_healthy

    traefik:
        # === IMAGE ================================================ #
        image: traefik:2
        # === EXECUTION ============================================ #
        command:
            - --api.dashboard=true
            - --api.insecure=true
            - --providers.docker
            - --providers.docker.constraints=Label(`com.docker.compose.project`,`${COMPOSE_PROJECT_NAME:-agenta-oss-dev}`)
            - --entrypoints.web.address=:80
            - --ping=true
            - --accesslog=true
        # === STORAGE ============================================== #
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
        # === NETWORK ============================================== #
        networks:
            - agenta-network
        ports:
            - "${TRAEFIK_PORT:-80}:80"
            - "127.0.0.1:${TRAEFIK_UI_PORT:-8080}:8080"
        # === LIFECYCLE ============================================ #
        restart: always
        healthcheck:
            test: ["CMD", "traefik", "healthcheck", "--ping"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 10s

    supertokens:
        # === IMAGE ================================================ #
        image: supertokens/supertokens-postgresql:11
        # === CONFIGURATION ======================================== #
        env_file:
            - ${ENV_FILE:-./.env.oss.dev}
        environment:
            POSTGRESQL_CONNECTION_URI: ${POSTGRES_URI_SUPERTOKENS:-postgresql://username:password@postgres:5432/agenta_oss_supertokens}
        # === NETWORK ============================================== #
        networks:
            - agenta-network
        # === ORCHESTRATION ======================================== #
        depends_on:
            postgres:
                condition: service_healthy
            alembic:
                condition: service_completed_successfully
        # === LIFECYCLE ============================================ #
        restart: always
        healthcheck:
            test: >
                bash -c 'exec 3<>/dev/tcp/127.0.0.1/3567 && echo -e "GET /hello HTTP/1.1\r\nhost: 127.0.0.1:3567\r\nConnection: close\r\n\r\n" >&3 && cat <&3 | grep "Hello"'
            interval: 10s
            timeout: 5s
            retries: 5

    #
    #
    #
    #
    #
    #
    #
    #
    #
    #
    #
    # Fake upstreams (D23, WP5): the only reachable targets for Checkpoint A's acceptance
    # suite. Not profile-gated — unlike the composio and tunnel services these are ours, not a third-party
    # dependency, so they run every deploy (entities.md §0, "the gateways have no
    # third-party dependency to gate on").
    mock-llm-gateway:
        # === IMAGE ================================================ #
        image: agenta-oss-dev-api:latest
        # === EXECUTION ============================================ #
        command:
            [
                "uvicorn",
                "oss.src.core.gateways.llms.providers.mock.app:app",
                "--host",
                "0.0.0.0",
                "--port",
                "9091",
            ]
        # === NETWORK ============================================== #
        environment:
            AGENTA_GATEWAYS_MOCKS_ENABLED: "true"
            AGENTA_GATEWAYS_MOCKS_UPSTREAM_TOKEN: ${AGENTA_GATEWAYS_MOCKS_UPSTREAM_TOKEN:-agenta-gateway-mock-token}
        ports:
            - "127.0.0.1:9091:9091"
        networks:
            - agenta-network
        # === LIFECYCLE ============================================ #
        restart: always
        healthcheck:
            test: ["CMD", "curl", "-sf", "http://localhost:9091/health"]
            interval: 5s
            timeout: 5s
            retries: 10

    mock-mcp-gateway:
        # === IMAGE ================================================ #
        image: agenta-oss-dev-api:latest
        # === EXECUTION ============================================ #
        command:
            [
                "uvicorn",
                "oss.src.core.gateways.mcps.providers.mock.app:app",
                "--host",
                "0.0.0.0",
                "--port",
                "9092",
            ]
        # === NETWORK ============================================== #
        environment:
            AGENTA_GATEWAYS_MOCKS_ENABLED: "true"
            AGENTA_GATEWAYS_MOCKS_UPSTREAM_TOKEN: ${AGENTA_GATEWAYS_MOCKS_UPSTREAM_TOKEN:-agenta-gateway-mock-token}
        ports:
            - "127.0.0.1:9092:9092"
        networks:
            - agenta-network
        # === LIFECYCLE ============================================ #
        restart: always
        healthcheck:
            test: ["CMD", "curl", "-sf", "http://localhost:9092/health"]
            interval: 5s
            timeout: 5s
            retries: 10

    #
    #
    #
    #
    #
    #

    # Dev tunnel for Composio trigger events (disable: run.sh --no-tunnel).
    composio:
        # === ACTIVATION =========================================== #
        profiles:
            - with-tunnel
        # === IMAGE ================================================ #
        image: python:3.13-slim-trixie
        # === EXECUTION ============================================ #
        command:
            - bash
            - -c
            - "pip install --quiet --root-user-action=ignore composio httpx && python /app/dispatcher_composio.py"
        # === STORAGE ============================================== #
        volumes:
            - ../../../api/entrypoints/dispatcher_composio.py:/app/dispatcher_composio.py:ro
        # === CONFIGURATION ======================================== #
        env_file:
            - ${ENV_FILE:-./.env.oss.dev}
        environment:
            AGENTA_INGRESS_URL: http://api:8000/triggers/composio/events/
            PYTHONUNBUFFERED: "1"
        # === NETWORK ============================================== #
        networks:
            - agenta-network
        # === ORCHESTRATION ======================================== #
        depends_on:
            api:
                condition: service_started
        # === LIFECYCLE ============================================ #
        restart: always

networks:
    agenta-network:

volumes:
    postgres-data:
    redis-volatile-data:
    redis-durable-data:
    seaweed-data:
    nextjs-oss-cache:
    turbo-oss-cache:
    nextjs-mobile-cache:
    turbo-mobile-cache:
