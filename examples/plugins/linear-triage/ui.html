<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif}body{margin:0;padding:24px;max-width:960px}h1{font-size:24px;margin:0 0 8px}p{line-height:1.5}button{padding:10px 16px;border:1px solid #8888;border-radius:8px;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:default}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #8884}th:last-child,td:last-child{text-align:right}input{width:18px;height:18px}#status{min-height:24px}a{color:inherit}@media(max-width:480px){body{padding:16px}th,td{padding:10px 4px}h1{font-size:20px}}
</style></head><body><h1>Linear triage</h1><p>Review your open issues. Scores reflect priority and due dates. Select up to five issues to add the Urgent label.</p><div class="actions"><button id="load">Load my issues</button><button id="label" disabled>Label as urgent</button></div><p id="status" role="status" aria-live="polite">Load your issues to begin.</p><table hidden id="table"><thead><tr><th><span aria-label="Select">Select</span></th><th>Issue</th><th>Score</th></tr></thead><tbody id="rows"></tbody></table><script>
const load=document.getElementById('load'), label=document.getElementById('label'), status=document.getElementById('status'), rows=document.getElementById('rows');
let issues=[],busy=false;
const selected=()=>Array.from(rows.querySelectorAll('input:checked')).map(el=>el.value);
const controls=()=>{load.disabled=busy;label.disabled=busy||!selected().length||selected().length>5};
load.onclick=async()=>{busy=true;controls();status.textContent='Loading your issues…';try{issues=await agenta.plugin.call('my_open_issues',{});rows.replaceChildren();for(const issue of issues){const tr=document.createElement('tr'),check=document.createElement('input');check.type='checkbox';check.value=issue.id;check.setAttribute('aria-label','Select '+issue.title);check.onchange=controls;const select=document.createElement('td');select.append(check);const title=document.createElement('td');title.textContent=(issue.identifier?issue.identifier+' · ':'')+issue.title;const score=document.createElement('td');score.textContent=issue.score;tr.append(select,title,score);rows.append(tr)}document.getElementById('table').hidden=!issues.length;status.textContent=issues.length?issues.length+' issues loaded.':'No open issues found.'}catch(e){status.textContent=e.message}finally{busy=false;controls()}};
label.onclick=async()=>{busy=true;controls();status.textContent='Adding the label…';try{const result=await agenta.plugin.call('bulk_label',{ids:selected(),label:'Urgent'});status.textContent=result.error?result.labeled.length+' labeled. '+result.error+' '+result.message:result.labeled.length+' issues labeled.';for(const el of rows.querySelectorAll('input:checked'))el.checked=false}catch(e){status.textContent=e.message+' Check Linear before trying again.'}finally{busy=false;controls()}};
</script></body></html>
