name: "41 - railway setup"

on:
  workflow_call:
    inputs:
      pr_number:
        description: "PR number"
        required: true
        type: string
      image_tag:
        description: "Pinned app-image tag to deploy (pr-<n>-<sha>; never 'latest')"
        required: true
        type: string
    secrets:
      RAILWAY_TOKEN:
        required: true
      AGENTA_TEST_OSS_AUTH_KEY:
        required: false
    outputs:
      project_name:
        description: "Railway project name"
        value: ${{ jobs.setup.outputs.project_name }}
      environment_name:
        description: "Railway environment name"
        value: ${{ jobs.setup.outputs.environment_name }}
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number"
        required: true
        type: string
      image_tag:
        description: "Pinned app-image tag to deploy (pr-<n>-<sha>; never 'latest')"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: railway-preview-setup-${{ inputs.pr_number }}
  cancel-in-progress: true

env:
  RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  # Template location (issue #5650). The repo variables let a future template
  # project move happen without a code change; the scripts carry the same
  # defaults, so local runs and CI agree.
  RAILWAY_TEMPLATE_PROJECT: ${{ vars.RAILWAY_TEMPLATE_PROJECT || 'agenta-oss-clone-spike' }}
  RAILWAY_TEMPLATE_ENV: ${{ vars.RAILWAY_TEMPLATE_ENV || 'pr-template' }}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      project_name: ${{ steps.clone.outputs.project_name }}
      environment_name: ${{ steps.clone.outputs.environment_name }}
    steps:
      - uses: actions/checkout@v6

      - name: Install jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y jq
          fi

      # Create-or-update the per-PR environment in the template project, patch
      # the app images to this run's tag, wait for green, and smoke it — all in
      # one script, pure GraphQL (no Railway CLI). The deploy workflow (43)
      # then only re-verifies and posts the preview URL.
      - name: Create or update preview environment
        id: clone
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          # The acceptance suites authenticate admin calls with this key;
          # clones inherit the template's own generated key, so the script
          # upserts the CI key onto the clone before anything deploys.
          AGENTA_AUTH_KEY: ${{ secrets.AGENTA_TEST_OSS_AUTH_KEY }}
        run: |
          chmod +x hosting/railway/oss/scripts/*.sh

          # Persist the full log so the "Upload setup log" step can publish it
          # as an artifact, regardless of live-log truncation.
          log_file="${GITHUB_WORKSPACE:-$PWD}/railway-setup-${PR_NUMBER:-unknown}.log"

          set +e
          hosting/railway/oss/scripts/preview-clone-create.sh 2>&1 | tee "$log_file"
          setup_status=${PIPESTATUS[0]}
          set -e

          if [ "$setup_status" -ne 0 ]; then
            {
              echo "### Railway Preview Setup — Failed"
              echo
              echo "<details><summary>Setup log (last 100 lines)</summary>"
              echo
              echo '```'
              tail -n 100 "$log_file" 2>/dev/null
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$setup_status"
          fi

      - name: Upload setup log
        if: always()
        # Diagnostics only: a failed/duplicate upload must never fail the job.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: railway-setup-log-${{ inputs.pr_number }}
          path: railway-setup-*.log
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

      - name: Summary
        run: |
          {
            echo "### Railway Preview Setup"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| PR | \`${{ inputs.pr_number }}\` |"
            echo "| Project | \`${{ steps.clone.outputs.project_name }}\` |"
            echo "| Environment | \`${{ steps.clone.outputs.environment_name }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
