name: 22 - check desktop app mentions

permissions:
  contents: read

# No paths filter: a mention can be added to any file.
on:
  pull_request:
  workflow_dispatch:

jobs:
  desktop-app-refs:
    name: No desktop app mentions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check for mentions of the removed desktop app
        run: bash scripts/check-no-desktop-app-refs.sh
