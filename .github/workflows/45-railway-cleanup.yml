name: "45 - railway cleanup"

on:
  pull_request:
    types: [closed, converted_to_draft]
  workflow_run:
    workflows: ["14 - check PR preview", "46 - railway preview comment"]
    types: [completed]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR to reconcile (empty enumerates all previews; does not force-delete a valid hold)"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write
  actions: write

env:
  RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_TEMPLATE_PROJECT: ${{ vars.RAILWAY_TEMPLATE_PROJECT || 'agenta-oss-clone-spike' }}
  RAILWAY_TEMPLATE_ENV: ${{ vars.RAILWAY_TEMPLATE_ENV || 'pr-template' }}

jobs:
  legacy-tests:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    concurrency:
      group: railway-clone-preview-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Reconcile abandoned acceptance-test environments
        run: python3 hosting/railway/oss/scripts/preview_lifecycle.py legacy-tests

  inventory:
    runs-on: ubuntu-latest
    outputs:
      prs: ${{ steps.list.outputs.prs }}
    steps:
      - uses: actions/checkout@v6
        with:
          # workflow_run must never execute code from the completed PR run.
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Enumerate current previews
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            python3 - <<'PY'
          import json, os, re
          pr = os.environ['PR_NUMBER']
          if not re.fullmatch(r'[1-9][0-9]*', pr):
              raise SystemExit('Invalid PR number')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('prs=' + json.dumps([int(pr)]) + '\n')
          PY
          else
            python3 hosting/railway/oss/scripts/preview_lifecycle.py list
          fi

  reconcile:
    needs: inventory
    if: needs.inventory.outputs.prs != '[]'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        pr: ${{ fromJSON(needs.inventory.outputs.prs) }}
    uses: ./.github/workflows/49-railway-lifecycle.yml
    with:
      operation: sweep
      pr_number: ${{ format('{0}', matrix.pr) }}
    secrets: inherit
