name: "45 - railway cleanup"

on:
  pull_request:
    types: [closed, converted_to_draft]
  schedule:
    # Run daily at 06:00 UTC to clean up stale previews
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to destroy (leave empty for stale cleanup only)"
        required: false
        type: string
      max_age_hours:
        description: "Max age in hours for stale cleanup (default: 24)"
        required: false
        type: string
        default: "24"
      dry_run:
        description: "Dry run mode (true/false)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

env:
  RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  # Template location (issue #5650). The repo variables let a future template
  # project move happen without a code change; the scripts carry the same
  # defaults, so local runs and CI agree.
  RAILWAY_TEMPLATE_PROJECT: ${{ vars.RAILWAY_TEMPLATE_PROJECT || 'agenta-oss-clone-spike' }}
  RAILWAY_TEMPLATE_ENV: ${{ vars.RAILWAY_TEMPLATE_ENV || 'pr-template' }}

jobs:
  destroy-pr-preview:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.pr_number != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y jq
          fi

      # The preview is an environment in the template project (issue #5650) —
      # delete just that environment (idempotent: absent = success).
      - name: Destroy preview environment
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          chmod +x hosting/railway/oss/scripts/preview-clone-destroy.sh
          hosting/railway/oss/scripts/preview-clone-destroy.sh

      - name: Update preview comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const marker = '<!-- railway-preview-bot -->';
            const action = context.payload.action;
            const reason = action === 'converted_to_draft'
              ? 'Destroyed (PR converted to draft)'
              : 'Destroyed (PR closed)';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              const body = [
                marker,
                '### Railway Preview Environment',
                '',
                '| | |',
                '|---|---|',
                `| **Status** | ${reason} |`,
                '',
                `_Updated at ${new Date().toISOString()}_`,
              ].join('\n');

              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            }

      - name: Summary
        if: always()
        run: |
          echo "### Railway Preview Cleanup" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **PR:** #${{ github.event.pull_request.number || inputs.pr_number }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Action:** Destroyed preview environment" >> "$GITHUB_STEP_SUMMARY"

  cleanup-stale:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.pr_number == '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y jq
          fi

      # Safety net for previews that outlived their PR (a cancelled run that
      # died mid-cycle, a workflow bug): delete pr-* preview environments in
      # the template project older than the max age. A sweep with nothing to
      # delete costs ~3 API calls.
      - name: Clean up stale preview environments
        env:
          RAILWAY_PREVIEW_DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          chmod +x hosting/railway/oss/scripts/preview-clone-destroy.sh
          hosting/railway/oss/scripts/preview-clone-destroy.sh \
            --stale-hours "${{ inputs.max_age_hours || '24' }}"

      - name: Summary
        if: always()
        run: |
          echo "### Railway Stale Preview Cleanup" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Max age:** ${{ inputs.max_age_hours || '24' }}h" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Dry run:** ${{ inputs.dry_run || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
