<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Four shapes of AI agent products</title>
  <desc id="desc">A comparison of task agents, workflow builders, personal assistants, and team coworkers by the kind of work they handle.</desc>
  <rect width="1600" height="900" fill="#f5f9ff"/>
  <g font-family="Inter, Arial, sans-serif" fill="#17213a">
    <text x="100" y="110" font-size="54" font-weight="700">Four shapes of AI agent product</text>
    <text x="100" y="164" font-size="25" fill="#59657a">Choose based on the relationship you need with the work.</text>
  </g>
  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(100 240)">
      <rect width="320" height="500" rx="28" fill="#ffffff" stroke="#c7d7f4" stroke-width="3"/>
      <circle cx="56" cy="58" r="28" fill="#e8f0ff"/>
      <path d="M43 58h26M56 45v26" stroke="#285dd7" stroke-width="5" stroke-linecap="round"/>
      <text x="32" y="132" font-size="31" font-weight="700" fill="#17213a">Task agent</text>
      <text x="32" y="180" font-size="22" fill="#59657a">Give it a goal.</text>
      <text x="32" y="216" font-size="22" fill="#59657a">Receive a deliverable.</text>
      <line x1="32" y1="264" x2="288" y2="264" stroke="#e2e8f4" stroke-width="2"/>
      <text x="32" y="316" font-size="19" font-weight="700" fill="#285dd7">BEST WHEN</text>
      <text x="32" y="360" font-size="22" fill="#17213a">The request changes</text>
      <text x="32" y="394" font-size="22" fill="#17213a">each time.</text>
      <text x="32" y="454" font-size="19" fill="#59657a">Examples: research,</text>
      <text x="32" y="486" font-size="19" fill="#59657a">slides, analysis</text>
    </g>
    <g transform="translate(460 240)">
      <rect width="320" height="500" rx="28" fill="#ffffff" stroke="#c7d7f4" stroke-width="3"/>
      <circle cx="56" cy="58" r="28" fill="#e8f0ff"/>
      <path d="M39 50h34M39 58h34M39 66h34" stroke="#285dd7" stroke-width="4" stroke-linecap="round"/>
      <text x="32" y="132" font-size="31" font-weight="700" fill="#17213a">Workflow builder</text>
      <text x="32" y="180" font-size="22" fill="#59657a">Define the steps.</text>
      <text x="32" y="216" font-size="22" fill="#59657a">Repeat the process.</text>
      <line x1="32" y1="264" x2="288" y2="264" stroke="#e2e8f4" stroke-width="2"/>
      <text x="32" y="316" font-size="19" font-weight="700" fill="#285dd7">BEST WHEN</text>
      <text x="32" y="360" font-size="22" fill="#17213a">The process is known</text>
      <text x="32" y="394" font-size="22" fill="#17213a">in advance.</text>
      <text x="32" y="454" font-size="19" fill="#59657a">Examples: routing,</text>
      <text x="32" y="486" font-size="19" fill="#59657a">approvals, reports</text>
    </g>
    <g transform="translate(820 240)">
      <rect width="320" height="500" rx="28" fill="#ffffff" stroke="#c7d7f4" stroke-width="3"/>
      <circle cx="56" cy="58" r="28" fill="#e8f0ff"/>
      <circle cx="56" cy="51" r="9" fill="none" stroke="#285dd7" stroke-width="4"/>
      <path d="M39 72c4-12 30-12 34 0" fill="none" stroke="#285dd7" stroke-width="4" stroke-linecap="round"/>
      <text x="32" y="132" font-size="31" font-weight="700" fill="#17213a">Personal assistant</text>
      <text x="32" y="180" font-size="22" fill="#59657a">Lives with one person.</text>
      <text x="32" y="216" font-size="22" fill="#59657a">Learns their context.</text>
      <line x1="32" y1="264" x2="288" y2="264" stroke="#e2e8f4" stroke-width="2"/>
      <text x="32" y="316" font-size="19" font-weight="700" fill="#285dd7">BEST WHEN</text>
      <text x="32" y="360" font-size="22" fill="#17213a">One user wants deep</text>
      <text x="32" y="394" font-size="22" fill="#17213a">control and continuity.</text>
      <text x="32" y="454" font-size="19" fill="#59657a">Examples: devices,</text>
      <text x="32" y="486" font-size="19" fill="#59657a">messages, local tools</text>
    </g>
    <g transform="translate(1180 240)">
      <rect width="320" height="500" rx="28" fill="#17213a"/>
      <circle cx="56" cy="58" r="28" fill="#d7e5ff"/>
      <circle cx="49" cy="52" r="7" fill="none" stroke="#285dd7" stroke-width="4"/>
      <circle cx="66" cy="55" r="6" fill="none" stroke="#285dd7" stroke-width="4"/>
      <path d="M35 72c4-11 25-11 29 0M57 74c3-9 20-9 24 0" fill="none" stroke="#285dd7" stroke-width="4" stroke-linecap="round"/>
      <text x="32" y="132" font-size="31" font-weight="700" fill="#ffffff">Team coworker</text>
      <text x="32" y="180" font-size="22" fill="#c5ccda">Owns a responsibility.</text>
      <text x="32" y="216" font-size="22" fill="#c5ccda">Improves with the team.</text>
      <line x1="32" y1="264" x2="288" y2="264" stroke="#465169" stroke-width="2"/>
      <text x="32" y="316" font-size="19" font-weight="700" fill="#88aeff">BEST WHEN</text>
      <text x="32" y="360" font-size="22" fill="#ffffff">Work continues across</text>
      <text x="32" y="394" font-size="22" fill="#ffffff">people and time.</text>
      <text x="32" y="454" font-size="19" fill="#c5ccda">Examples: outreach,</text>
      <text x="32" y="486" font-size="19" fill="#c5ccda">support, operations</text>
    </g>
  </g>
</svg>
