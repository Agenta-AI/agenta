const DOCS = [{"path": "proposal.md", "md": "# Agent and session sharing\n\n## Why\n\nPeople need to share an agent without sharing every conversation with it. They also need to invite colleagues to read or contribute to one conversation. Existing prompt and evaluation users must keep their project access.\n\nThis change specifies the first release. It does not implement it. Private sessions remain inspectable by project trace readers because trace filtering is outside this release.\n\n## What Changes\n\n- Add private or project visibility to agents, separate from their management owner.\n- Add Owner, Participant, and Viewer access to web agent sessions. Sharing covers existing history, future replies, and session files.\n- Support changing a project-visible agent back to private without moving its versions or files.\n- Let Slack installations run configured agents without linked Agenta users. Agenta readers of Slack sessions follow the agent audience.\n- Preserve existing roles, prompts, evaluations, traces, and analytics defaults. Migrate existing agents to project visibility. Migrate old agent chats to private only when a human creator is verified.\n- Move access decisions into shared core services and database filtering into database access objects (DAOs).\n\nAdmin-only trace access is an accepted restricted policy option, not a global migration default. Under that option, non-admin users lose the analytics currently guarded by the same capability. A separate analytics permission and safe metrics endpoint are future work.\n\n## Capabilities\n\n### New Capabilities\n\n- `agent-resource-access`: Agent visibility, ownership, direct access, and privatization.\n- `agent-session-sharing`: Named session roles, sharing changes, and session files.\n- `channel-session-access`: Slack session audience and bounded channel execution.\n- `sharing-compatibility`: Upgrade classification and existing product behavior.\n- `sharing-access-boundaries`: Layer responsibilities, capability checks, and revocation.\n\n### Modified Capabilities\n\nNone. Existing Slack addressing and selection behavior remain unchanged. The new channel access checks apply after agent selection. Trace and analytics behavior is explicitly preserved.\n\n## Impact\n\nChanges will affect workflow and session services, channel invocation, file access, list queries, and their UI controls. The design adds `agent_access`, `session_grants`, session access columns, and an immutable artifact reference on channel threads. It does not change span storage or trace query filtering.\n\nThe implementation must cover OSS and EE, including EE entitlement shortcuts. All implementation tasks remain unchecked. The review pages identify proposed defaults separately from previously agreed scope.\n"}, {"path": "design.md", "md": "# Sharing data and responsibilities\n\n## Context\n\nCode evidence was rechecked against release/v0.122.8 at `0f6137987e3c19d4b8640d28c81ba0612c707ea5`. Paths below are relative to the repository root. These are source observations, not results from an implemented privacy system.\n\n| Area | Today and evidence | Expected |\n| --- | --- | --- |\n| Workflow identity | `api/oss/src/core/workflows/dtos.py:144` puts `is_agent` on revisions. Stable artifacts also serve prompts and evaluators. | Keep agent access on a stable artifact extension. Do not infer access from the requested revision's flag. |\n| Session state | `api/oss/src/dbs/postgres/sessions/streams/dbes.py:69` explains that heartbeats replace flags. | Store access in dedicated columns and invitation rows. |\n| Project roles | `api/oss/src/core/access/permissions/service.py:308` has the EE entitlement bypass; `:329` has owner shortcuts. | Preserve capability resolution, but apply mandatory agent/session access afterward. |\n| Traces and metrics | `api/oss/src/apis/fastapi/tracing/router.py:508` and `:571` check VIEW_SPANS for analytics. `web/packages/agenta-observability/src/api/dashboard.ts:20` uses analytics. | Keep both checks and defaults. Restricted trace policies also restrict these metrics. |\n| Cost display | `web/packages/agenta-chat/src/components/TurnMetrics.tsx:8` combines trace and message usage; `web/packages/agenta-chat/src/assets/trace.ts:102` contains trace-derived calculations. | Missing access means unavailable values, not zero cost. No complete fallback is promised. |\n| Slack history | `api/oss/src/dbs/postgres/channels/dbes.py:135` defines append-only threads; `api/oss/src/dbs/postgres/channels/dao.py:483` deletes channel agents. | Store the workflow artifact parent on the thread so deletion does not break historical access. |\n| Channel actor | `api/oss/src/tasks/asyncio/channels/inbox.py:1049` can invoke under a linked user or creator. | Keep external sender attribution and bound installation authority separate from technical user IDs. |\n| Historical owner | `api/oss/src/middlewares/auth.py:1060` uses API-key creator identity; `api/oss/src/core/sessions/streams/service.py:765` includes creation without a human actor. | Never infer a human session owner from created_by_id alone. |\n\n## Goals / Non-Goals\n\nGoals: independent agent and web-session sharing; collaborative sessions; unchanged legacy access; a small data model; one access decision boundary; future EE custom-role compatibility.\n\nNon-goals: personal credential delegation, per-session trace filtering, trace schema changes, a usage-only analytics API, a generic permission graph, custom-role administration UI, Slack user linking, a new Slack delivery feature, or a full RBAC rewrite.\n\n## Decisions\n\n### Data structures\n\n| Structure | Fields and constraints | Writer |\n| --- | --- | --- |\n| agent_access | Composite key `(project_id, artifact_id)` referencing the workflow artifact; `visibility: private or project`; nullable `owner_user_id`. Private requires an active member owner. Null owner is allowed only for legacy project-visible records pending assignment. | Agent creation and dedicated sharing/transfer service. |\n| session_streams | `visibility: private or project`; `owner_user_id`. Apply explicit sharing to classified web agent chats. Private requires an owner. Existing non-agent session semantics remain unchanged. | Session creation and sharing service. |\n| session_grants | Composite unique key `(project_id, stream_id, user_id)`; `role: viewer or participant`; project-qualified foreign key to session. Owner is derived from the session row, not duplicated. | Session owner through sharing service. |\n| channel_threads | Immutable `artifact_id`, qualified by project. New threads require a verified parent. Migration can temporarily leave unresolved historical rows null. | Channel service resolves the selected workflow before creating the thread. |\n\nEvery user grant is limited to the same project. Current membership is required even if a stale grant remains. Creation, transfer, and visibility updates validate membership inside the write transaction. Access fields are not editable through generic metadata, heartbeat, or model-generated configuration updates.\n\n| Option | Trade-off | Choice |\n| --- | --- | --- |\n| Visibility and ownership in one enum | Conflates audience and management; transfer becomes unclear. | Reject. |\n| Access columns on every workflow artifact | Fewer joins, but changes shared prompt/evaluator storage. | Reject for this scope. |\n| **Agent access extension; separate owner and visibility** | One join and explicit creation/migration paths. Isolates legacy workflows. | **Choose.** |\n| Named grants in session JSON | Fewer tables, but harder uniqueness, concurrent updates, and user-based list filtering. | Reject. |\n| **Small invitation table** | One extra table; direct indexes and uniqueness. | **Choose because named Viewer/Participant sharing is agreed.** |\n\nAbsence of agent_access means historical project behavior only for legacy or non-agent artifacts. Agent creation UI, template loading, and agent-aware SDK creation write access in the artifact transaction. Once an access row exists, no ordinary update may delete it to restore legacy access. Direct variants, revisions, clones, mounts, and skills resolve that artifact before authorization.\n\n### Session rules\n\nOwner reads and manages sharing, deletion, and archiving. Participants read and contribute. Viewers read. Sending to an agent additionally requires permission to use that agent and the existing project execution capability. Reading web-session history does not require agent use. Project visibility grants Viewer access in this first scope; named Participants can contribute. Choosing Only me removes project visibility and every named invitation in one transaction.\n\nNew agent UI creations and new web agent chats request private access. Older clients that omit new policy fields retain the prior project default during rollout. This compatibility rule must be explicit in API validation and tests.\n\n### Responsibility by layer\n\n| Layer | Responsibility |\n| --- | --- |\n| Router | Authenticate, validate request shape, pass trusted context, map errors. |\n| Core resource service | Load resource facts, require access, perform business operations. Background entry points use the same service. |\n| Core access service | Resolve membership, capabilities, owner and invitations. Produce decisions or typed read scopes. No SQLAlchemy. |\n| DAO | Translate typed read scopes into SQL before ordering, counts, pagination, and search. Constrain writes. |\n| Runner/channel boundary | Carry server-derived authority through tool calls. Never derive authority from prompt text. |\n| File/credential service | Resolve parent access and issue only required permissions. No independent file invitation list. |\n\nThe direct-read rule and list scope must pass the same scenario fixtures. Privacy checks are a mandatory AND after project capability checks. EE entitlement and organization-owner shortcuts cannot bypass agent or session access. Trace access remains the stated exception.\n\n### Make private and transfer\n\nAn active owner with the existing edit capability can manage their agent sharing. A project member with the new manage-agent-sharing capability can manage project-visible agents and recover ownerless project-visible agents. Map that capability to existing project administrators initially. It does not allow reading someone else's private agent or session by itself.\n\nA dedicated transaction validates the target owner, checks the current policy version or locks the row, and updates owner and visibility together. Show affected installations and schedules before confirmation. Making private pauses external channel invocation. Queue workers and sensitive tool operations recheck authority; work that loses authority stops before its next external action. Other people's web-session history stays under session access. Their next agent invocation is denied. Slack history follows the original artifact's current audience. Making project-visible again does not silently reactivate paused installations. Ownership transfer does not transfer connection secrets.\n\n### Slack audience and execution\n\nVerified Slack events pass the existing installation and allowed-space checks after existing routing selects the agent. A bounded internal context carries project, binding, artifact, session, and external sender. It grants execution of that installed agent, not the installer's general permissions. Subagent and tool access remain bounded by the configured authority. Actions that require an Agenta approver remain pending for an authorized Agenta user; an unlinked Slack identity cannot satisfy that role.\n\nAgenta readers follow the associated agent audience, including Slack direct messages and private-channel conversations. Explain that audience in installation setup. Never copy Slack membership or add named Slack-session grants. Rebinding starts a new session association. Historic threads keep their artifact. Disconnect stops new requests and retains the history association. Deleted protected parents deny reads; unresolved legacy parents retain only documented pre-migration access until classified.\n\n### Trace and analytics policy\n\n| Option | Trade-off | Choice |\n| --- | --- | --- |\n| **Keep existing trace capabilities and assignments** | Preserves analytics and legacy usage. Trace readers can inspect private-chat content. | **Baseline for this change.** |\n| Admin-only trace access in an explicitly restricted deployment | Smaller content audience; non-admin analytics and some cost displays disappear. EE bypasses must enforce the restriction first. | Supported policy direction, not an automatic migration or a new per-project settings feature. |\n| Separate analytics and content capabilities | Supports aggregate costs without transcript access; requires a bounded metrics API review. | Deferred. |\n| Per-session tracing | Stronger content privacy; substantial query and migration changes. | Out of scope. |\n\nCurrent EE catalog overrides are deployment settings, not proof of a per-project policy switch. Do not promise a switch that does not exist. Keep trace ingestion, storage, queries, billing collection, and role defaults unchanged. The UI must state that project trace readers can inspect captured session content. If a restricted policy is selected, denied metrics display as unavailable. Do not treat denial as zero usage or zero billable cost.\n\nCompetitor evidence supports separating analytics from content as a later capability. Dust documents admin analytics without conversation access. Langdock gives creators/editors analytics and separately shared feedback chats. Gumloop describes analytics permissions separately from saved conversation access. These are vendor statements, not enforcement tests:\n- https://docs.dust.tt/docs/user-documentation/getting-started/use-cases-and-guides/collaboration\n- https://docs.langdock.com/en/using-langdock/agents/analytics\n- https://docs.gumloop.com/core-concepts/agent_performance\n\n### RBAC migration\n\nKeep role IDs and current capability defaults. Put legacy membership reads behind a core interface implemented by a DAO. Route old and new consumers through one resolver. Future EE stored custom roles can implement the same catalog boundary. Services ask for capabilities, not role names. This release does not implement custom-role persistence or UI. Membership synchronization must not restore deliberate removals or overwrite deliberate roles.\n\n## Risks / Trade-offs\n\n- Private means restricted agent/session/file APIs, not confidentiality from trace readers. This exception is visible in the sharing UI and documentation.\n- Historical creator data can be ambiguous. A verified human classification may apply to few old sessions.\n- Files already downloaded cannot be recalled. Issued storage credentials remain valid until expiry. Document actual bounds before rollout.\n- Lists, revisions, templates, exports, streams, project notifications, and worker actions can bypass a partial implementation. Cover all before enabling private defaults.\n- No admin private-content bypass is proposed outside the existing trace policy. Ownership recovery must not become an undeclared bypass.\n\n## Migration\n\n1. Produce a read-only classification preview for agent artifacts, web agent sessions, channel sessions, and legacy prompt/evaluation sessions. Identify channels through trusted thread relations, not a creator ID.\n2. Add schema without changing old permissions. Backfill agents to project visibility. Preserve creator attribution separately from owner.\n3. Make an old web agent chat private only with independent evidence of an actual human creator who remains an active member. Otherwise keep project visibility. Leave prompts, evaluations, and their sessions unchanged.\n4. Backfill channel artifact parents from verified references. Do not guess unresolved parents. Require parents for new threads.\n5. Enable new private requests only after service, list, file, worker, and stream checks pass in OSS and EE. Record migration decisions and support idempotent restart.\n6. Rollback must disable new private access paths rather than restore broad reads for resources already presented as private. Preserve additive columns until protected traffic is safely routed.\n"}, {"path": "specs/agent-resource-access/spec.md", "md": "## ADDED Requirements\n\n### Requirement: Stable agent policy\nThe system SHALL store agent visibility separately from ownership at the stable workflow artifact and SHALL require active project membership and the applicable project capability.\n\n#### Scenario: Private agent\n- **WHEN** Bob requests Alice's private agent without ownership\n- **THEN** the service SHALL deny access through lists, artifact, variant, revision, template, clone, skill, and file paths.\n\n#### Scenario: Project agent\n- **WHEN** an active member has the required project capability and the agent is project-visible\n- **THEN** the service SHALL allow the corresponding use or edit operation.\n\n#### Scenario: Policy row protection\n- **WHEN** a private artifact is edited through a generic workflow update\n- **THEN** the update SHALL NOT remove or bypass its agent access policy.\n\n### Requirement: Change visibility in both directions\nThe system SHALL support changing project visibility to private and private visibility to project without moving the artifact, versions, or files.\n\n#### Scenario: Make private\n- **WHEN** an authorized sharing manager confirms an active private owner\n- **THEN** the service SHALL update owner and visibility atomically, pause external installations, and deny future use by other members.\n\n#### Scenario: Old web conversation\n- **WHEN** Bob retains session read access after Alice makes its agent private\n- **THEN** Bob SHALL still read that web history but SHALL NOT invoke the private agent.\n\n#### Scenario: Make shared again\n- **WHEN** the owner makes the agent project-visible\n- **THEN** authorized project members SHALL regain agent access and paused external installations SHALL remain paused until explicitly enabled.\n\n#### Scenario: Transfer without credentials\n- **WHEN** an authorized user transfers agent management\n- **THEN** the operation SHALL NOT transfer credentials and SHALL validate the configured connection authority.\n\n### Requirement: Private default for new agent UI\nNew agent UI creation SHALL explicitly request private access with the authenticated owner while legacy creation clients retain documented project defaults.\n\n#### Scenario: New UI agent\n- **WHEN** Alice creates an agent in the updated UI\n- **THEN** the agent SHALL be private to Alice subject to active membership and capabilities.\n\n#### Scenario: Legacy SDK\n- **WHEN** an existing client omits access policy\n- **THEN** creation SHALL preserve its previous project-visible behavior and SHALL NOT silently privatize a prompt or evaluator.\n"}, {"path": "specs/agent-session-sharing/spec.md", "md": "## ADDED Requirements\n\n### Requirement: Named session roles\nWeb agent sessions SHALL support an owner and named Viewer or Participant grants. Shared content SHALL include existing history, future replies, and session files.\n\n#### Scenario: Viewer\n- **WHEN** Carol has Viewer access\n- **THEN** Carol SHALL read shared content but SHALL NOT send requests, approve actions, or change sharing.\n\n#### Scenario: Participant\n- **WHEN** Bob has Participant access and may use the selected agent\n- **THEN** Bob SHALL contribute using the agent-owned account; participation alone SHALL NOT grant sharing or agent editing.\n\n#### Scenario: Read without agent use\n- **WHEN** Bob has session read access but cannot use the agent\n- **THEN** Bob SHALL read the web history and SHALL be denied a new invocation.\n\n#### Scenario: Approval\n- **WHEN** a participant requests an action requiring approval\n- **THEN** only an authenticated requester with authority for that pending action SHALL approve it in this release; read access alone SHALL NOT suffice.\n\n### Requirement: Manage session sharing\nOnly the session owner SHALL change ordinary web-session invitations, delete the session, or archive it. Project-wide sharing SHALL grant Viewer access in this first release.\n\n#### Scenario: Named invitation\n- **WHEN** the owner gives Bob Participant and Carol Viewer\n- **THEN** the service SHALL retain the two distinct grants, reject cross-project users, and prevent duplicate grants.\n\n#### Scenario: Only me\n- **WHEN** the owner selects Only me\n- **THEN** the service SHALL remove project visibility and all named grants atomically.\n\n#### Scenario: Revocation\n- **WHEN** a member loses all session grants or project membership\n- **THEN** new session reads and requests SHALL be denied and active streams SHALL recheck access.\n\n#### Scenario: Private creation\n- **WHEN** a new web agent session is created by an authenticated human\n- **THEN** the session SHALL start private with that human as owner.\n\n### Requirement: Parent access for files\nSession file reads, downloads, exports, and issued storage access SHALL require the parent session permission. Ordinary runs SHALL write generated files to their session and SHALL NOT edit shared agent files without agent edit permission.\n\n#### Scenario: Guessed file\n- **WHEN** a user without session read permission guesses a file identifier\n- **THEN** the file service SHALL deny access.\n\n#### Scenario: Expired sharing\n- **WHEN** session access is removed after a download or credential was issued\n- **THEN** new credentials SHALL be denied; the system SHALL document that prior downloads and unexpired credentials are not recalled.\n"}, {"path": "specs/channel-session-access/spec.md", "md": "## ADDED Requirements\n\n### Requirement: Slack audience without account linking\nAgenta read access to a Slack session SHALL follow its original workflow artifact audience, without Slack user linking or membership copying.\n\n#### Scenario: Project agent Slack history\n- **WHEN** a project member can use the project-visible associated agent\n- **THEN** the member SHALL read its Slack sessions in Agenta, including direct-message sessions, under the disclosed audience rule.\n\n#### Scenario: Rebinding\n- **WHEN** a binding changes to a different agent\n- **THEN** new sessions SHALL use the new artifact and existing sessions SHALL retain their immutable artifact parent.\n\n#### Scenario: Deleted binding\n- **WHEN** a channel agent binding is deleted\n- **THEN** historical access SHALL resolve the stored artifact rather than requiring the deleted binding.\n\n#### Scenario: Private parent\n- **WHEN** the original artifact becomes private\n- **THEN** Agenta readers SHALL follow its private audience and the external installation SHALL pause.\n\n### Requirement: Bounded channel execution\nThe channel service SHALL derive execution authority from the verified installation and allowed space. It SHALL preserve the external sender identity and SHALL NOT grant general creator authority.\n\n#### Scenario: Allowed Slack event\n- **WHEN** a verified sender in an allowed space invokes the configured agent\n- **THEN** the service SHALL use the configured agent-owned account without requiring a linked Agenta identity.\n\n#### Scenario: Administrative request\n- **WHEN** an external sender requests a tool beyond installation authority\n- **THEN** the service SHALL deny the operation even if a technical creator ID is present.\n\n#### Scenario: Unlinked approval\n- **WHEN** a Slack response is offered for an action requiring an Agenta approval role\n- **THEN** the service SHALL NOT treat that sender as the creator or as an authenticated Agenta approver.\n\n#### Scenario: Disconnect\n- **WHEN** a connection is disabled\n- **THEN** new external requests SHALL stop and the historical artifact association SHALL remain intact.\n"}, {"path": "specs/sharing-access-boundaries/spec.md", "md": "## ADDED Requirements\n\n### Requirement: Mandatory resource checks\nCore services SHALL combine project capabilities with agent/session access. OSS and EE SHALL apply resource checks independently of entitlement or owner shortcuts.\n\n#### Scenario: EE broad project grant\n- **WHEN** project capability evaluation returns true through an entitlement or owner shortcut\n- **THEN** the resource service SHALL still enforce the agent/session policy.\n\n#### Scenario: List and direct read\n- **WHEN** the same actor lists resources and fetches one by ID\n- **THEN** the list predicate and direct-read decision SHALL agree before counts and pagination.\n\n#### Scenario: Background execution\n- **WHEN** a worker resumes a queued run after access is removed\n- **THEN** the worker SHALL recheck authority before dispatch and before its next sensitive external action.\n\n#### Scenario: Subagent\n- **WHEN** an authorized run calls a second agent\n- **THEN** the call SHALL require use of the called agent and SHALL NOT inherit its creator's general authority.\n\n### Requirement: Layer ownership\nRouters SHALL pass authenticated context; core SHALL decide access; DAOs SHALL apply SQL filters from typed read scopes. Generic updates SHALL NOT write access policy.\n\n#### Scenario: Concurrent sharing update\n- **WHEN** two users submit ownership or visibility changes\n- **THEN** the service SHALL use a transaction and lock or version check to prevent stale authorization from overwriting newer policy.\n\n#### Scenario: Future custom roles\n- **WHEN** EE later supplies stored custom role definitions\n- **THEN** resource services SHALL consume the existing capability resolver contract rather than hard-coded role names.\n\n#### Scenario: Membership sync\n- **WHEN** legacy synchronization runs after an explicit membership removal\n- **THEN** it SHALL NOT restore that access or overwrite a deliberate role assignment.\n"}, {"path": "specs/sharing-compatibility/spec.md", "md": "## ADDED Requirements\n\n### Requirement: Legacy access preservation\nThe upgrade SHALL preserve current role identifiers, default capabilities, prompts, evaluators, evaluations, test sets, and their session access.\n\n#### Scenario: Existing agent\n- **WHEN** an existing agent is migrated\n- **THEN** its visibility SHALL be project and valid attribution SHALL remain recorded.\n\n#### Scenario: Legacy evaluation\n- **WHEN** an evaluation session shares the same storage as agent sessions\n- **THEN** the agent-chat migration SHALL NOT change its access.\n\n#### Scenario: Known human chat\n- **WHEN** independent persisted evidence identifies an active human creator of an old web agent chat\n- **THEN** the migration SHALL assign that owner and private visibility.\n\n#### Scenario: Unknown chat owner\n- **WHEN** creator evidence is missing, ambiguous, or identifies an inactive member\n- **THEN** the chat SHALL remain project-visible and SHALL require explicit valid owner assignment before privatization.\n\n#### Scenario: API-key attribution\n- **WHEN** created_by_id identifies a key creator without proof of interactive creation\n- **THEN** the migration SHALL NOT treat that field alone as verified human ownership.\n\n### Requirement: Trace and analytics baseline\nThis change SHALL preserve trace storage, ingestion, filtering, and current VIEW_SPANS assignments. Agent/session privacy SHALL NOT be represented as hiding content from project trace readers.\n\n#### Scenario: Existing analytics user\n- **WHEN** a user currently has trace and analytics access\n- **THEN** the default upgrade SHALL retain that access.\n\n#### Scenario: Private conversation trace\n- **WHEN** a project trace reader opens captured content from a private session\n- **THEN** the existing trace policy SHALL continue to apply and the sharing interface SHALL disclose this exception.\n\n#### Scenario: Explicit restricted policy\n- **WHEN** a deployment deliberately enforces admin-only trace access\n- **THEN** non-admin analytics guarded by VIEW_SPANS SHALL be denied; unavailable metrics SHALL NOT display as zero.\n\n#### Scenario: Future metrics split\n- **WHEN** usage-only analytics are requested without trace content access\n- **THEN** the implementation SHALL require a separately reviewed capability and bounded endpoint rather than relabeling unrestricted trace queries.\n"}, {"path": "tasks.md", "md": "## 1. Baseline and migration evidence\n\n- [ ] 1.1 Inventory all agent/session reads, writes, streams, exports, templates, mounts, and worker entry points.\n- [ ] 1.2 Produce the migration classification preview and confirm human-creator evidence.\n- [ ] 1.3 Freeze legacy access fixtures for prompts, evaluations, API keys, roles, and analytics in OSS and EE.\n\n## 2. Data and services\n\n- [ ] 2.1 Add agent_access, session access columns, session_grants, and channel artifact parent with constraints and indexes.\n- [ ] 2.2 Implement transactional creation, transfer, make-private, invitation, and Only me operations.\n- [ ] 2.3 Put membership persistence behind a DAO interface while preserving one capability resolver.\n- [ ] 2.4 Implement mandatory resource decisions and typed query scopes; protect generic update routes.\n\n## 3. Entry points and channels\n\n- [ ] 3.1 Apply artifact access to direct revisions, lists, clones, templates, skills, and file credentials.\n- [ ] 3.2 Apply session roles to reads, sends, approvals, lists, files, exports, and live streams.\n- [ ] 3.3 Carry bounded installation context through Slack and tools; preserve routing and reply behavior.\n- [ ] 3.4 Pause external grants on privatization; recheck schedules, subagents, queued work, and sensitive actions.\n\n## 4. Interface and compatibility\n\n- [ ] 4.1 Add agent sharing and make-private controls with dependency preview and owner selection.\n- [ ] 4.2 Add session Viewer/Participant invitations and explicit project read sharing.\n- [ ] 4.3 Disclose project trace-reader access and Slack history audience in the relevant setup/sharing screens.\n- [ ] 4.4 Keep trace defaults; show denied metrics as unavailable and verify billing/quotas remain separate.\n\n## 5. Validation and rollout\n\n- [ ] 5.1 Run access scenario fixtures through both direct services and database list predicates.\n- [ ] 5.2 Test alternate reads and worker calls in OSS and EE with entitlements on and off.\n- [ ] 5.3 Test concurrent sharing writes, membership removal, stream rechecks, and storage expiry.\n- [ ] 5.4 Test legacy workflow clients and migration restart, unresolved parents, and rollback without privacy downgrade.\n- [ ] 5.5 Enable private UI defaults only after complete access-path coverage; publish measured revocation limits.\n"}];
const tabs = document.getElementById('tabs'), doc = document.getElementById('doc');
function show(i){
  [...tabs.children].forEach((b,j)=>b.setAttribute('aria-selected', String(i===j)));
  doc.innerHTML = marked.parse(DOCS[i].md);
  doc.querySelectorAll('table').forEach(t=>{const w=document.createElement('div');w.className='tbl';t.replaceWith(w);w.appendChild(t);});
  try{ localStorage.setItem('tab', String(i)); }catch(e){}
}
DOCS.forEach((d,i)=>{const b=document.createElement('button');b.role='tab';b.textContent=d.path;b.onclick=()=>show(i);tabs.appendChild(b);});
let start=0; try{ start=Math.min(+localStorage.getItem('tab')||0, DOCS.length-1); }catch(e){}
show(start);
</script>
